name: lwIP P2 bridge

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/lwip-p2.yml'
      - 'CMakeLists.txt'
      - 'src/bridge/**'
      - 'src/runtime/**'
      - 'src/lwip/**'
      - 'src/host/**'
      - 'src/p2_main.c'
      - 'src/p2_ipv6_main.c'
      - 'scripts/fetch-lwip.sh'
      - 'scripts/p2-bridge-smoke.sh'
      - 'scripts/p2-ipv6-bridge-smoke.sh'
      - 'scripts/p2-backpressure-smoke.sh'
      - 'scripts/p2-halfclose-smoke.sh'
      - 'scripts/p2-backend-recovery-smoke.sh'
      - 'scripts/p2-reset-recovery-smoke.sh'
      - 'scripts/p2-concurrency-smoke.sh'
      - 'scripts/p2-active-shutdown-smoke.sh'
      - '.lwip-baseline'
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bridge-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout tcp-shift
        uses: actions/checkout@v4

      - name: Install P2 dependencies
        run: |
          sudo apt-get update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            git \
            iproute2 \
            libcap2-bin \
            python3

      - name: Validate bridge harness
        run: |
          sh -n scripts/fetch-lwip.sh
          sh -n scripts/p2-bridge-smoke.sh
          sh -n scripts/p2-ipv6-bridge-smoke.sh
          sh -n scripts/p2-backpressure-smoke.sh
          sh -n scripts/p2-halfclose-smoke.sh
          sh -n scripts/p2-backend-recovery-smoke.sh
          sh -n scripts/p2-reset-recovery-smoke.sh
          sh -n scripts/p2-concurrency-smoke.sh
          sh -n scripts/p2-active-shutdown-smoke.sh
          sudo modprobe tun || true
          test -c /dev/net/tun

      - name: Build pinned P2 runtimes
        run: |
          sh scripts/fetch-lwip.sh
          cmake -S . -B .build -DCMAKE_BUILD_TYPE=Release
          cmake --build .build --target \
            tcp-shift-p2 \
            tcp-shift-p2-ipv6 \
            --parallel

      - name: Grant TUN administration capability for IPv4 bridge
        run: |
          sudo setcap cap_net_admin+ep .build/tcp-shift-p2
          getcap .build/tcp-shift-p2 | tee .build/p2-capability.txt
          grep -F 'cap_net_admin=ep' .build/p2-capability.txt

      - name: Exercise IPv4 public bridge and natural teardown
        run: sh scripts/p2-bridge-smoke.sh

      - name: Enforce deterministic bidirectional bridge backpressure
        run: sh scripts/p2-backpressure-smoke.sh

      - name: Exercise backend-first half-close without readiness spin
        run: sh scripts/p2-halfclose-smoke.sh

      - name: Exercise backend refusal and fresh-flow recovery
        run: sh scripts/p2-backend-recovery-smoke.sh

      - name: Exercise public/backend resets and recovery
        run: sh scripts/p2-reset-recovery-smoke.sh

      - name: Exercise concurrent bridge flows
        run: sh scripts/p2-concurrency-smoke.sh

      - name: Exercise active-flow shutdown cleanup
        run: sh scripts/p2-active-shutdown-smoke.sh

      - name: Exercise IPv6 public bridge to IPv4 loopback backend
        run: |
          sudo env TCP_SHIFT_P2_IPV6_BINARY="$PWD/.build/tcp-shift-p2-ipv6" \
            sh scripts/p2-ipv6-bridge-smoke.sh

      - name: Upload P2 diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tcp-shift-p2-bridge-diagnostics
          path: |
            .build/p2-capability.txt
            .build/p2-bridge-ci
            .build/p2-backpressure-ci
            .build/p2-halfclose-ci
            .build/p2-backend-recovery-ci
            .build/p2-reset-recovery-ci
            .build/p2-concurrency-ci
            .build/p2-active-shutdown-ci
            .build/p2-ipv6-bridge-ci
          if-no-files-found: warn
