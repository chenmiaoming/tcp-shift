name: lwIP P0

on:
  push:
    branches:
      - main
      - feat/lwip-prototype
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build pinned lwIP smoke target
        run: make build
      - name: Run smoke target
        run: ./.build/tcp-shift
