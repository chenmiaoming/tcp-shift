name: P6 BBR model

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/p6-bbr.yml'
      - 'CMakeLists.txt'
      - 'src/cc/**'
      - 'src/lwip/cc_adapter.c'
      - 'src/lwip/cc_adapter.h'
      - 'src/lwip/cc_bbr_internal.c'
      - 'src/lwip/cc_bbr_accept.c'
      - 'src/lwip/tcp_memory.c'
      - 'src/bridge/bridge.c'
      - 'src/p2_main.c'
      - 'src/lwip/tcp_memory.h'
      - 'src/lwipopts.h'
      - 'src/tests/bbr_model_test.c'
      - 'src/tests/bbr_startup_policy_test.c'
      - 'src/tests/bbr_drain_policy_test.c'
      - 'src/tests/bbr_probe_policy_test.c'
      - 'src/tests/bbr_controller_test.c'
      - 'src/tests/bbr_timeout_test.c'
      - 'src/tests/bbr_delivery_snapshot_test.c'
      - 'src/tests/bbr_lwip_binding_test.c'
      - 'scripts/p6-bbr-model-contract.sh'
      - 'scripts/p6-bbr-startup-policy-contract.sh'
      - 'scripts/p6-bbr-drain-policy-contract.sh'
      - 'scripts/p6-bbr-probe-policy-contract.sh'
      - 'scripts/p6-bbr-controller-contract.sh'
      - 'scripts/p6-delivery-snapshot-contract.sh'
      - 'scripts/p6-bbr-lwip-binding-contract.sh'
      - 'scripts/p6-bbr-long-flow.sh'
      - 'scripts/p4-cc-recovery-smoke.sh'
      - 'scripts/validate-p4-cc.sh'
      - 'scripts/fetch-lwip.sh'
      - 'patches/lwip-p4-cc-hooks.patch'
      - '.lwip-baseline'
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  model-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout tcp-shift
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            binutils \
            build-essential \
            cmake

      - name: Validate P6 harnesses
        run: |
          sh -n scripts/p6-bbr-model-contract.sh
          sh -n scripts/p6-bbr-startup-policy-contract.sh
          sh -n scripts/p6-bbr-drain-policy-contract.sh
          sh -n scripts/p6-bbr-probe-policy-contract.sh
          sh -n scripts/p6-bbr-controller-contract.sh

      - name: Qualify BBR model estimation
        run: sh scripts/p6-bbr-model-contract.sh

      - name: Qualify compact BBR Startup policy
        run: sh scripts/p6-bbr-startup-policy-contract.sh

      - name: Qualify compact BBR Drain policy
        run: sh scripts/p6-bbr-drain-policy-contract.sh

      - name: Qualify compact BBR ProbeBW and ProbeRTT policy
        run: sh scripts/p6-bbr-probe-policy-contract.sh

      - name: Qualify internal compact BBR ACK lifecycle
        run: sh scripts/p6-bbr-controller-contract.sh

      - name: Requalify pure-C CC boundary
        run: sh scripts/validate-p4-cc.sh

      - name: Upload P6 model diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tcp-shift-p6-bbr-model
          path: |
            .build/p6-bbr-model-contract
            .build/p6-bbr-startup-policy-contract
            .build/p6-bbr-drain-policy-contract
            .build/p6-bbr-probe-policy-contract
            .build/p6-bbr-controller-contract
            .build/p4-cc/evidence
          if-no-files-found: warn
          include-hidden-files: true

  delivery-snapshot-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout tcp-shift
        uses: actions/checkout@v4

      - name: Install adapter build dependencies
        run: |
          sudo apt-get update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            git

      - name: Validate P6c harness
        run: |
          sh -n scripts/fetch-lwip.sh
          sh -n scripts/p6-delivery-snapshot-contract.sh
          sh -n scripts/p6-bbr-lwip-binding-contract.sh

      - name: Build pinned lwIP delivery adapter
        run: |
          sh scripts/fetch-lwip.sh
          cmake -S . -B .build -DCMAKE_BUILD_TYPE=Release
          cmake --build .build --target tcp_shift_lwip_cc_adapter tcp_shift_lwip_tcp_memory --parallel

      - name: Qualify cumulative delivered snapshots
        run: sh scripts/p6-delivery-snapshot-contract.sh

      - name: Qualify internal BBR lwIP ACK binding
        run: sh scripts/p6-bbr-lwip-binding-contract.sh

      - name: Upload P6c snapshot diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tcp-shift-p6-delivery-snapshot
          path: |
            .build/p6-delivery-snapshot-summary.txt
            .build/p6-bbr-lwip-binding-summary.txt
          if-no-files-found: warn


  runtime-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout tcp-shift
        uses: actions/checkout@v4

      - name: Install live recovery dependencies
        run: |
          sudo apt-get update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            git \
            iproute2 \
            iptables \
            python3
          sudo modprobe tun || true
          test -c /dev/net/tun

      - name: Validate live BBR harness
        run: |
          sh -n scripts/fetch-lwip.sh
          sh -n scripts/p6-bbr-long-flow.sh
          sh -n scripts/p4-cc-recovery-smoke.sh

      - name: Build internal BBR bridge qualification target
        run: |
          sh scripts/fetch-lwip.sh
          cmake -S . -B .build -DCMAKE_BUILD_TYPE=Release
          cmake --build .build --target tcp-shift-p6-bbr --parallel

      - name: Exercise internal BBR long-flow shared pacing
        run: |
          sudo env \
            TCP_SHIFT_P6_BBR_LONG_BINARY="$PWD/.build/tcp-shift-p6-bbr" \
            TCP_SHIFT_P6_BBR_LONG_OUT="$PWD/.build/p6-bbr-long-flow-ci" \
            sh scripts/p6-bbr-long-flow.sh

      - name: Exercise internal BBR fast recovery
        run: |
          sudo env \
            TCP_SHIFT_P4_BINARY="$PWD/.build/tcp-shift-p6-bbr" \
            TCP_SHIFT_P4_CC=bbr-internal \
            TCP_SHIFT_P4_REQUIRE_PACING=1 \
            TCP_SHIFT_P4_REQUIRE_RETRANSMIT=1 \
            TCP_SHIFT_P4_OUT="$PWD/.build/p6-bbr-fast-loss-ci" \
            TCP_SHIFT_P4_TUN_NAME=tsp6bbr0 \
            TCP_SHIFT_P4_PUBLIC_PORT=18160 \
            TCP_SHIFT_P4_BACKEND_PORT=19160 \
            sh scripts/p4-cc-recovery-smoke.sh fast-loss

      - name: Exercise internal BBR high-BDP multiple-loss recovery
        run: |
          sudo env \
            TCP_SHIFT_P6_BBR_LONG_BINARY="$PWD/.build/tcp-shift-p6-bbr" \
            TCP_SHIFT_P6_BBR_LONG_OUT="$PWD/.build/p6-bbr-multi-loss-ci" \
            TCP_SHIFT_P6_BBR_LONG_PAYLOAD_BYTES=1048576 \
            TCP_SHIFT_P6_BBR_LONG_FAULT_MODE=multi-loss \
            sh scripts/p6-bbr-long-flow.sh

      - name: Exercise internal BBR RTO recovery
        run: |
          sudo env \
            TCP_SHIFT_P4_BINARY="$PWD/.build/tcp-shift-p6-bbr" \
            TCP_SHIFT_P4_CC=bbr-internal \
            TCP_SHIFT_P4_REQUIRE_PACING=1 \
            TCP_SHIFT_P4_REQUIRE_RETRANSMIT=1 \
            TCP_SHIFT_P4_OUT="$PWD/.build/p6-bbr-rto-ci" \
            TCP_SHIFT_P4_TUN_NAME=tsp6bbr1 \
            TCP_SHIFT_P4_PUBLIC_PORT=18161 \
            TCP_SHIFT_P4_BACKEND_PORT=19161 \
            sh scripts/p4-cc-recovery-smoke.sh rto

      - name: Upload live BBR recovery diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tcp-shift-p6-bbr-runtime-recovery
          path: |
            .build/p6-bbr-long-flow-ci
            .build/p6-bbr-fast-loss-ci
            .build/p6-bbr-multi-loss-ci
            .build/p6-bbr-rto-ci
            .build/upstream.env
            .build/lwip-critical.sha256
            .build/lwip-patch.env
            .build/lwip-p4-cc-hooks.applied.diff
          if-no-files-found: warn
          include-hidden-files: true
