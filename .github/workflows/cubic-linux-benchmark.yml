name: CUBIC Linux benchmark

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/cubic-linux-benchmark.yml'
      - 'scripts/cubic-linux-benchmark.sh'
      - 'scripts/cubic-reno-benchmark.sh'
      - 'scripts/p3-backend-to-public-residency.sh'
      - 'src/lwipopts.h'
      - 'src/config_contract.c'
      - 'src/cc/cubic.c'
      - 'src/cc/cubic.h'
      - 'src/cc/cubic_hystart.c'
      - 'src/cc/cubic_controller.c'
      - 'src/tests/cubic_hystart_test.c'
      - 'src/tests/cc_live_selector_test.c'
      - 'src/lwip/cc_adapter.c'
      - 'src/lwip/cc_selector.c'
      - 'src/p2_main.c'
      - 'scripts/fetch-lwip.sh'
      - 'patches/lwip-p4-cc-hooks.patch'
      - '.lwip-baseline'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compare-linux-cubic:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - case: low-bdp
            rtt_ms: 10
            rate_mbit: 20
            loss_pct: '0'
            payload_bytes: 4194304
            queue_pkts: 35
          - case: low-bdp-small-buffer
            rtt_ms: 10
            rate_mbit: 20
            loss_pct: '0'
            payload_bytes: 4194304
            queue_pkts: 18
          - case: edge-bdp
            rtt_ms: 40
            rate_mbit: 10
            loss_pct: '0'
            payload_bytes: 4194304
            queue_pkts: 69
          - case: lossy-wan
            rtt_ms: 40
            rate_mbit: 10
            loss_pct: '0.1'
            payload_bytes: 4194304
            queue_pkts: 69
          - case: high-bdp
            rtt_ms: 100
            rate_mbit: 50
            loss_pct: '0'
            payload_bytes: 8388608
            queue_pkts: 857

    steps:
      - name: Checkout tcp-shift
        uses: actions/checkout@v4

      - name: Install benchmark dependencies
        run: |
          sudo apt-get update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            ethtool \
            git \
            iproute2 \
            iptables \
            kmod \
            python3
          sudo modprobe tun || true
          sudo modprobe ifb || true
          test -c /dev/net/tun
          sysctl net.ipv4.tcp_available_congestion_control

      - name: Validate benchmark harness
        run: sh -n scripts/cubic-linux-benchmark.sh

      - name: Build pinned tcp-shift runtime
        run: |
          sh scripts/fetch-lwip.sh
          cmake -S . -B .build -DCMAKE_BUILD_TYPE=Release
          cmake --build .build --target tcp-shift-p2 --parallel

      - name: Compare tcp-shift CUBIC with Linux tcp_cubic
        run: |
          sudo env \
            TCP_SHIFT_CUBIC_BENCH_BINARY="$PWD/.build/tcp-shift-p2" \
            TCP_SHIFT_CUBIC_BENCH_CASE="${{ matrix.case }}" \
            TCP_SHIFT_CUBIC_BENCH_RTT_MS="${{ matrix.rtt_ms }}" \
            TCP_SHIFT_CUBIC_BENCH_RATE_MBIT="${{ matrix.rate_mbit }}" \
            TCP_SHIFT_CUBIC_BENCH_LOSS_PCT="${{ matrix.loss_pct }}" \
            TCP_SHIFT_CUBIC_BENCH_PAYLOAD_BYTES="${{ matrix.payload_bytes }}" \
            TCP_SHIFT_CUBIC_BENCH_QUEUE_PKTS="${{ matrix.queue_pkts }}" \
            sh scripts/cubic-linux-benchmark.sh

      - name: Publish benchmark summary
        if: always()
        run: |
          summary=".build/cubic-linux-benchmark/${{ matrix.case }}/summary.txt"
          if [ -f "$summary" ]; then
            cat "$summary" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload benchmark diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cubic-linux-${{ matrix.case }}
          path: .build/cubic-linux-benchmark/${{ matrix.case }}
          if-no-files-found: warn
          include-hidden-files: true

  compare-tcp-shift-cubic-reno:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - case: low-bdp
            rtt_ms: 10
            rate_mbit: 20
            loss_pct: '0'
            payload_bytes: 4194304
            queue_pkts: 35
          - case: low-bdp-small-buffer
            rtt_ms: 10
            rate_mbit: 20
            loss_pct: '0'
            payload_bytes: 4194304
            queue_pkts: 18
          - case: edge-bdp
            rtt_ms: 40
            rate_mbit: 10
            loss_pct: '0'
            payload_bytes: 4194304
            queue_pkts: 69
          - case: lossy-wan
            rtt_ms: 40
            rate_mbit: 10
            loss_pct: '0.1'
            payload_bytes: 4194304
            queue_pkts: 69
          - case: high-bdp
            rtt_ms: 100
            rate_mbit: 50
            loss_pct: '0'
            payload_bytes: 8388608
            queue_pkts: 857

    steps:
      - name: Checkout tcp-shift
        uses: actions/checkout@v4

      - name: Install benchmark dependencies
        run: |
          sudo apt-get update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            git \
            iproute2 \
            iptables \
            kmod \
            python3
          sudo modprobe tun || true
          sudo modprobe ifb || true
          test -c /dev/net/tun

      - name: Validate benchmark harness
        run: sh -n scripts/cubic-reno-benchmark.sh

      - name: Build pinned tcp-shift runtime
        run: |
          sh scripts/fetch-lwip.sh
          cmake -S . -B .build -DCMAKE_BUILD_TYPE=Release
          cmake --build .build --target tcp-shift-p2 --parallel

      - name: Compare tcp-shift CUBIC with tcp-shift Reno
        run: |
          sudo env \
            TCP_SHIFT_CC_BENCH_BINARY="$PWD/.build/tcp-shift-p2" \
            TCP_SHIFT_CC_BENCH_CASE="${{ matrix.case }}" \
            TCP_SHIFT_CC_BENCH_RTT_MS="${{ matrix.rtt_ms }}" \
            TCP_SHIFT_CC_BENCH_RATE_MBIT="${{ matrix.rate_mbit }}" \
            TCP_SHIFT_CC_BENCH_LOSS_PCT="${{ matrix.loss_pct }}" \
            TCP_SHIFT_CC_BENCH_PAYLOAD_BYTES="${{ matrix.payload_bytes }}" \
            TCP_SHIFT_CC_BENCH_QUEUE_PKTS="${{ matrix.queue_pkts }}" \
            sh scripts/cubic-reno-benchmark.sh

      - name: Publish benchmark summary
        if: always()
        run: |
          summary=".build/cubic-reno-benchmark/${{ matrix.case }}/summary.txt"
          if [ -f "$summary" ]; then
            cat "$summary" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload benchmark diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cubic-reno-${{ matrix.case }}
          path: .build/cubic-reno-benchmark/${{ matrix.case }}
          if-no-files-found: warn
          include-hidden-files: true

  sender-capacity-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - sndbuf_kib: 256
            sndbuf_bytes: 262144
          - sndbuf_kib: 512
            sndbuf_bytes: 524288
          - sndbuf_kib: 1024
            sndbuf_bytes: 1048576

    steps:
      - name: Checkout tcp-shift
        uses: actions/checkout@v4

      - name: Install sender-capacity dependencies
        run: |
          sudo apt-get update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            git \
            iproute2 \
            iptables \
            kmod \
            python3
          sudo modprobe tun || true
          sudo modprobe ifb || true
          test -c /dev/net/tun

      - name: Build sender-capacity profile
        run: |
          sh scripts/fetch-lwip.sh
          build=".build-sndbuf-${{ matrix.sndbuf_kib }}"
          cmake -S . -B "$build" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_FLAGS="-DTCP_SHIFT_TCP_SND_BUF_BYTES=${{ matrix.sndbuf_bytes }}"
          cmake --build "$build" --target tcp-shift-config-contract tcp-shift-p2 --parallel
          "$build/tcp-shift-config-contract" | tee "$build/config-contract.txt"
          grep -F "tcp_snd_buf=${{ matrix.sndbuf_bytes }}" "$build/config-contract.txt"

      - name: Qualify clean high-BDP path
        run: |
          build="$PWD/.build-sndbuf-${{ matrix.sndbuf_kib }}"
          out="$PWD/.build/sender-buffer-qualification/${{ matrix.sndbuf_kib }}kib/clean-high-bdp"
          sudo env \
            TCP_SHIFT_CC_BENCH_BINARY="$build/tcp-shift-p2" \
            TCP_SHIFT_CC_BENCH_CASE="sndbuf-${{ matrix.sndbuf_kib }}-clean-high-bdp" \
            TCP_SHIFT_CC_BENCH_RTT_MS=100 \
            TCP_SHIFT_CC_BENCH_RATE_MBIT=50 \
            TCP_SHIFT_CC_BENCH_LOSS_PCT=0 \
            TCP_SHIFT_CC_BENCH_PAYLOAD_BYTES=8388608 \
            TCP_SHIFT_CC_BENCH_QUEUE_PKTS=857 \
            TCP_SHIFT_CC_BENCH_OUT="$out" \
            sh scripts/cubic-reno-benchmark.sh

      - name: Qualify 1 MiB profile on 270ms 25-percent-loss stress path
        if: ${{ matrix.sndbuf_kib == 1024 }}
        run: |
          build="$PWD/.build-sndbuf-${{ matrix.sndbuf_kib }}"
          out="$PWD/.build/sender-buffer-qualification/${{ matrix.sndbuf_kib }}kib/openvz-stress"
          sudo env \
            TCP_SHIFT_CC_BENCH_BINARY="$build/tcp-shift-p2" \
            TCP_SHIFT_CC_BENCH_CASE="sndbuf-${{ matrix.sndbuf_kib }}-openvz-stress" \
            TCP_SHIFT_CC_BENCH_RTT_MS=270 \
            TCP_SHIFT_CC_BENCH_RATE_MBIT=50 \
            TCP_SHIFT_CC_BENCH_LOSS_PCT=25 \
            TCP_SHIFT_CC_BENCH_PAYLOAD_BYTES=131072 \
            TCP_SHIFT_CC_BENCH_QUEUE_PKTS=1156 \
            TCP_SHIFT_CC_BENCH_OUT="$out" \
            sh scripts/cubic-reno-benchmark.sh

      - name: Publish sender-capacity summaries
        if: always()
        run: |
          root=".build/sender-buffer-qualification/${{ matrix.sndbuf_kib }}kib"
          {
            echo "## TCP_SND_BUF=${{ matrix.sndbuf_kib }} KiB"
            for summary in "$root"/*/summary.txt; do
              if [ -f "$summary" ]; then
                echo
                echo '```text'
                cat "$summary"
                echo '```'
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload sender-capacity diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sender-buffer-${{ matrix.sndbuf_kib }}kib
          path: |
            .build-sndbuf-${{ matrix.sndbuf_kib }}/config-contract.txt
            .build/sender-buffer-qualification/${{ matrix.sndbuf_kib }}kib
          if-no-files-found: warn
          include-hidden-files: true

  one-mib-residency:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout tcp-shift
        uses: actions/checkout@v4

      - name: Install residency dependencies
        run: |
          sudo apt-get update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            git \
            iproute2 \
            iptables \
            kmod \
            python3
          sudo modprobe tun || true
          test -c /dev/net/tun
          test -r /proc/self/smaps_rollup

      - name: Build 1 MiB sender profile
        run: |
          sh scripts/fetch-lwip.sh
          cmake -S . -B .build-sndbuf-1024-memory \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_FLAGS="-DTCP_SHIFT_TCP_SND_BUF_BYTES=1048576"
          cmake --build .build-sndbuf-1024-memory --target tcp-shift-config-contract tcp-shift-p2 --parallel
          .build-sndbuf-1024-memory/tcp-shift-config-contract | tee .build-sndbuf-1024-memory/config-contract.txt
          grep -F 'tcp_snd_buf=1048576' .build-sndbuf-1024-memory/config-contract.txt

      - name: Measure 1 MiB active and drained process residency
        run: |
          sudo env \
            TCP_SHIFT_P3_BINARY="$PWD/.build-sndbuf-1024-memory/tcp-shift-p2" \
            TCP_SHIFT_P3_B2P_FLOWS=8 \
            TCP_SHIFT_P3_B2P_PAYLOAD_BYTES=2097152 \
            sh scripts/p3-backend-to-public-residency.sh

      - name: Publish 1 MiB residency evidence
        if: always()
        run: |
          summary=.build/p3-backend-to-public-residency/summary.json
          if [ -f "$summary" ]; then
            {
              echo '## 1 MiB sender-buffer residency'
              echo '```json'
              cat "$summary"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload 1 MiB residency diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sender-buffer-1024kib-residency
          path: |
            .build-sndbuf-1024-memory/config-contract.txt
            .build/p3-backend-to-public-residency
          if-no-files-found: warn
          include-hidden-files: true
