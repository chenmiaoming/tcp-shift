name: lwIP upstream provenance

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/lwip-upstream.yml'
      - '.lwip-baseline'
      - 'scripts/fetch-lwip.sh'
      - 'patches/lwip-p4-cc-hooks.patch'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-upstream:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout tcp-shift
        uses: actions/checkout@v4

      - name: Validate provenance script
        run: |
          sh -n scripts/fetch-lwip.sh
          grep -Eq '^LWIP_REPOSITORY=https://github.com/lwip-tcpip/lwip\.git$' .lwip-baseline
          grep -Eq '^LWIP_COMMIT=[0-9a-f]{40}$' .lwip-baseline
          test -f patches/lwip-p4-cc-hooks.patch

      - name: Fetch exact lwIP baseline and apply controlled hook patch
        run: sh scripts/fetch-lwip.sh

      - name: Verify exact pin and controlled patch
        run: |
          . ./.lwip-baseline
          . ./.build/lwip-patch.env
          test "$(git -C .deps/lwip rev-parse HEAD)" = "$LWIP_COMMIT"
          test "$LWIP_PATCH" = 'patches/lwip-p4-cc-hooks.patch'
          test "$(sha256sum "$LWIP_PATCH" | awk '{print $1}')" = "$LWIP_PATCH_SHA256"
          git -C .deps/lwip diff --check
          git -C .deps/lwip apply --reverse --check "$PWD/$LWIP_PATCH"
          git -C .deps/lwip diff --name-only | sort > .build/lwip-modified-files.txt
          printf '%s\n' \
            src/core/tcp.c \
            src/core/tcp_in.c \
            src/core/tcp_out.c \
            > .build/lwip-expected-modified-files.txt
          cmp .build/lwip-expected-modified-files.txt .build/lwip-modified-files.txt
          test -z "$(git -C .deps/lwip ls-files --others --exclude-standard)"
          cmp "$LWIP_PATCH" .build/lwip-p4-cc-hooks.applied.diff

      - name: Show provenance
        run: |
          cat .build/upstream.env
          cat .build/lwip-critical.sha256
          cat .build/lwip-patch.env
          cat .build/lwip-modified-files.txt

      - name: Upload upstream provenance
        uses: actions/upload-artifact@v4
        with:
          name: lwip-upstream-provenance
          path: |
            .build/upstream.env
            .build/lwip-critical.sha256
            .build/lwip-patch.env
            .build/lwip-p4-cc-hooks.applied.diff
            .build/lwip-modified-files.txt
          if-no-files-found: error
