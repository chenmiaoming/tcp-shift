name: lwIP P4 CC boundary

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/lwip-p4.yml'
      - 'CMakeLists.txt'
      - 'src/cc/**'
      - 'src/lwip/**'
      - 'src/lwipopts.h'
      - 'src/p2_main.c'
      - 'src/tests/cc_contract_test.c'
      - 'src/tests/cc_live_selector_test.c'
      - 'src/tests/bbr_model_test.c'
      - 'scripts/fetch-lwip.sh'
      - 'scripts/validate-p4-cc.sh'
      - 'scripts/p4-live-selector-contract.sh'
      - 'scripts/p6-bbr-model-contract.sh'
      - 'scripts/p4-cc-recovery-smoke.sh'
      - 'patches/lwip-p4-cc-hooks.patch'
      - '.lwip-baseline'
      - 'docs/milestones/p4-cc-boundary.md'
      - 'docs/milestones/p6-bbr.md'
      - 'ARCHITECTURE.md'
      - 'docs/lwip-roadmap.md'
      - 'docs/ci.md'
      - 'docs/development.md'
      - 'README.md'
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pure-c-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout tcp-shift
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            binutils \
            build-essential \
            cmake

      - name: Validate standalone CC boundary
        run: |
          sh -n scripts/validate-p4-cc.sh
          sh scripts/validate-p4-cc.sh

      - name: Qualify P6 BBR model inside the pure-C boundary
        run: |
          sh -n scripts/p6-bbr-model-contract.sh
          sh scripts/p6-bbr-model-contract.sh

      - name: Upload P4/P6 pure-C diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tcp-shift-p4-cc-boundary
          path: |
            .build/p4-cc/evidence
            .build/p6-bbr-model-contract
          if-no-files-found: warn
          include-hidden-files: true

  integrated-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout tcp-shift
        uses: actions/checkout@v4

      - name: Install integration dependencies
        run: |
          sudo apt-get update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            git \
            iproute2 \
            iptables \
            python3
          sudo modprobe tun || true
          test -c /dev/net/tun

      - name: Validate integrated recovery harness
        run: |
          sh -n scripts/fetch-lwip.sh
          sh -n scripts/p4-live-selector-contract.sh
          sh -n scripts/p4-cc-recovery-smoke.sh

      - name: Build pinned bridge runtime with CC adapter
        run: |
          sh scripts/fetch-lwip.sh
          cmake -S . -B .build -DCMAKE_BUILD_TYPE=Release
          cmake --build .build --target tcp-shift-p2 --parallel

      - name: Qualify live Reno/CUBIC selector
        run: |
          sh scripts/p4-live-selector-contract.sh
          if .build/tcp-shift-p2 tsp4bad0 10.244.0.2 255.255.255.252 10.244.0.1 18149 19149 not-built \
              >.build/p4-invalid-selector.stdout 2>.build/p4-invalid-selector.stderr; then
            echo "unknown congestion controller unexpectedly succeeded" >&2
            exit 1
          fi
          grep -F 'unsupported congestion controller: not-built' \
            .build/p4-invalid-selector.stderr >/dev/null

      - name: Exercise integrated Reno fast retransmit loss path
        run: |
          sudo env TCP_SHIFT_P4_BINARY="$PWD/.build/tcp-shift-p2" \
            sh scripts/p4-cc-recovery-smoke.sh fast-loss

      - name: Exercise integrated CUBIC fast retransmit loss path
        run: |
          sudo env \
            TCP_SHIFT_P4_BINARY="$PWD/.build/tcp-shift-p2" \
            TCP_SHIFT_P4_CC=cubic \
            TCP_SHIFT_P4_OUT="$PWD/.build/p4-fast-loss-cubic-ci" \
            TCP_SHIFT_P4_TUN_NAME=tsp4cub0 \
            TCP_SHIFT_P4_PUBLIC_PORT=18142 \
            TCP_SHIFT_P4_BACKEND_PORT=19142 \
            sh scripts/p4-cc-recovery-smoke.sh fast-loss

      - name: Exercise integrated Reno RTO path
        run: |
          sudo env TCP_SHIFT_P4_BINARY="$PWD/.build/tcp-shift-p2" \
            sh scripts/p4-cc-recovery-smoke.sh rto

      - name: Upload integrated P4 diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tcp-shift-p4-integrated-recovery
          path: |
            .build/p4-fast-loss-ci
            .build/p4-fast-loss-cubic-ci
            .build/p4-rto-ci
            .build/p4-live-selector-summary.txt
            .build/p4-invalid-selector.stdout
            .build/p4-invalid-selector.stderr
            .build/upstream.env
            .build/lwip-critical.sha256
            .build/lwip-patch.env
            .build/lwip-p4-cc-hooks.applied.diff
          if-no-files-found: warn
