name: tcp-shift CI

on:
  push:
    branches:
      - main
      - 'feat/gvisor-*'
  pull_request:
  workflow_dispatch:
  schedule:
    # Scheduled workflows run from the default branch once this lands on main.
    - cron: '17 3 * * *'

permissions:
  contents: read

concurrency:
  group: tcp-shift-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gvisor-compatibility:
    name: gVisor compatibility (${{ matrix.track }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - track: verified-go-baseline
            ref: baseline
          - track: upstream-go
            ref: go
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # Use the current stable toolchain so a synthetic-go toolchain bump is
          # detected instead of being hidden behind a stale CI pin.
          go-version: stable
          cache: false

      - name: Build against selected gVisor synthetic-Go track
        shell: bash
        run: |
          if [[ '${{ matrix.ref }}' == go ]]; then
            GVISOR_REF=go bash ./scripts/build.sh
          else
            bash ./scripts/build.sh
          fi

      - name: Report embedded dependency revision
        run: |
          ./bin/tcp-shift --version
          cat ./bin/gvisor-build.txt

      - name: Smoke test CLI
        run: ./bin/tcp-shift --help

  upstream-gvisor-rack-control:
    name: Upstream gVisor CUBIC+RACK control
    # This job deliberately builds the exact synthetic-Go baseline with no
    # tcp-shift TCP patches. It tells us whether spurious RACK retransmissions
    # already exist in upstream gVisor or are introduced by our sender patches.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false

      - name: Install benchmark tools
        run: |
          sudo apt-get update
          sudo apt-get install -y iperf3 iproute2 iptables jq

      - name: Build unmodified gVisor control
        env:
          GVISOR_PATCHSET: vanilla
          OUTPUT: ${{ github.workspace }}/bin/tcp-shift-upstream
          PROVENANCE: ${{ github.workspace }}/bin/gvisor-build-upstream.txt
        run: bash ./scripts/build.sh

      - name: Verify vanilla provenance
        run: |
          ./bin/tcp-shift-upstream --version
          cat ./bin/gvisor-build-upstream.txt
          grep -qx 'patchset=vanilla' ./bin/gvisor-build-upstream.txt

      - name: Benchmark upstream CUBIC+RACK
        env:
          BIN: ${{ github.workspace }}/bin/tcp-shift-upstream
          OUT: ${{ github.workspace }}/.bench-upstream-rack
          # Native CUBIC is retained as a same-run control for runner/netem
          # variability; no experimental BBR symbol is requested from vanilla.
          BENCH_CASES: 'native-cubic gvisor-cubic'
          RATE: 100mbit
          ONE_WAY_DELAY: 100ms
          LOSS: '0%'
          DATA_LOSS: '0.10%'
          ACK_LOSS: '0%'
          RECOVERY: rack
          NETEM_LIMIT: '10000'
          DURATION: '15'
          TRIALS: '3'
          TCP_BUFFER_MIB: '8'
          CASE_TIMEOUT: '45'
        run: sudo -E bash ./scripts/bench-long-fat.sh

      - name: Publish upstream control summary
        if: always() && hashFiles('.bench-upstream-rack/summary.md') != ''
        run: |
          printf '### Unmodified upstream gVisor: CUBIC + RACK\n\n```text\n' >> "$GITHUB_STEP_SUMMARY"
          cat .bench-upstream-rack/scenario.txt >> "$GITHUB_STEP_SUMMARY"
          printf '```\n\n### Build provenance\n\n```text\n' >> "$GITHUB_STEP_SUMMARY"
          cat ./bin/gvisor-build-upstream.txt >> "$GITHUB_STEP_SUMMARY"
          printf '```\n\n' >> "$GITHUB_STEP_SUMMARY"
          cat .bench-upstream-rack/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload upstream control artifacts
        if: always() && hashFiles('.bench-upstream-rack/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: upstream-gvisor-cubic-rack-control
          path: |
            .bench-upstream-rack/
            bin/gvisor-build-upstream.txt
          include-hidden-files: true
          if-no-files-found: ignore

  long-fat-benchmark:
    name: Long-fat (${{ matrix.scenario }})
    # iperf3 runs with -R: tcp-shift is the WAN-facing sender. Delay and loss
    # are applied in an intermediate router namespace so native Linux BBR keeps
    # an fq sender qdisc and gets a meaningful pacing baseline.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - scenario: lossless-rack
            data_loss: '0%'
            ack_loss: '0%'
            recovery: rack
            trials: '1'
          - scenario: data-loss-rack
            data_loss: '0.10%'
            ack_loss: '0%'
            recovery: rack
            trials: '3'
          - scenario: data-loss-legacy
            data_loss: '0.10%'
            ack_loss: '0%'
            recovery: legacy
            trials: '3'
          - scenario: ack-loss-rack
            data_loss: '0%'
            ack_loss: '0.10%'
            recovery: rack
            trials: '3'
          - scenario: bidir-loss-rack
            data_loss: '0.10%'
            ack_loss: '0.10%'
            recovery: rack
            trials: '3'
          - scenario: bidir-loss-legacy
            data_loss: '0.10%'
            ack_loss: '0.10%'
            recovery: legacy
            trials: '3'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false

      - name: Install benchmark tools
        run: |
          sudo apt-get update
          sudo apt-get install -y iperf3 iproute2 iptables jq

      - name: Verify native Linux BBR baseline
        shell: bash
        run: |
          sudo modprobe tcp_bbr 2>/dev/null || true
          available=$(cat /proc/sys/net/ipv4/tcp_available_congestion_control)
          echo "available congestion controls: $available"
          if ! grep -qw bbr <<<"$available"; then
            echo "::error::GitHub runner does not expose native Linux BBR; refusing to publish an incomplete BBR comparison"
            exit 1
          fi

      - name: Build verified gVisor synthetic-Go baseline
        run: bash ./scripts/build.sh

      - name: Long-fat network benchmark
        env:
          # ~20 Mbit*second BDP: 100 Mbit/s and ~200 ms RTT.
          RATE: 100mbit
          ONE_WAY_DELAY: 100ms
          # LOSS is left at 0 so directional settings below are authoritative.
          LOSS: '0%'
          DATA_LOSS: ${{ matrix.data_loss }}
          ACK_LOSS: ${{ matrix.ack_loss }}
          RECOVERY: ${{ matrix.recovery }}
          NETEM_LIMIT: '10000'
          DURATION: '15'
          TRIALS: ${{ matrix.trials }}
          TCP_BUFFER_MIB: '8'
          CASE_TIMEOUT: '45'
        run: sudo -E bash ./scripts/bench-long-fat.sh

      - name: Publish benchmark summary
        if: always() && hashFiles('.bench/summary.md') != ''
        run: |
          printf '### Scenario: %s\n\n```text\n' '${{ matrix.scenario }}' >> "$GITHUB_STEP_SUMMARY"
          cat .bench/scenario.txt >> "$GITHUB_STEP_SUMMARY"
          printf '```\n\n### Build provenance\n\n```text\n' >> "$GITHUB_STEP_SUMMARY"
          cat ./bin/gvisor-build.txt >> "$GITHUB_STEP_SUMMARY"
          printf '```\n\n' >> "$GITHUB_STEP_SUMMARY"
          cat .bench/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload benchmark artifacts
        if: always() && hashFiles('.bench/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: long-fat-${{ matrix.scenario }}
          path: |
            .bench/
            bin/gvisor-build.txt
          include-hidden-files: true
          if-no-files-found: ignore
