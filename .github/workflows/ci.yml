name: tcp-shift CI

on:
  push:
    branches:
      - main
      - 'feat/gvisor-*'
  pull_request:
  workflow_dispatch:
  schedule:
    # Scheduled workflows run from the default branch once this lands on main.
    - cron: '17 3 * * *'

permissions:
  contents: read

concurrency:
  group: tcp-shift-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gvisor-compatibility:
    name: gVisor compatibility (${{ matrix.track }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - track: verified-go-baseline
            ref: baseline
          - track: upstream-go
            ref: go
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # Use the current stable toolchain so a synthetic-go toolchain bump is
          # detected instead of being hidden behind a stale CI pin.
          go-version: stable
          cache: false

      - name: Build against selected gVisor synthetic-Go track
        shell: bash
        run: |
          if [[ '${{ matrix.ref }}' == go ]]; then
            GVISOR_REF=go bash ./scripts/build.sh
          else
            bash ./scripts/build.sh
          fi

      - name: Report embedded dependency revision
        run: |
          ./bin/tcp-shift --version
          cat ./bin/gvisor-build.txt

      - name: Smoke test CLI
        run: ./bin/tcp-shift --help

  long-fat-benchmark:
    name: Long-fat (${{ matrix.scenario }})
    # Keep the three recovery scenarios independent. The goal is to distinguish
    # generic Netstack overhead from loss-recovery pathologies before treating
    # BBR-vs-CUBIC deltas as congestion-control results.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # Control: same high-BDP path with no artificial packet loss. If this
          # is fast, the large lossy-path gap is not generic TUN/Netstack cost.
          - scenario: lossless-rack
            loss: '0%'
            recovery: rack
          # Current gVisor default. protocol.go defaults TCPRecovery to
          # TCPRACKLossDetection.
          - scenario: lossy-rack
            loss: '0.10%'
            recovery: rack
          # Diagnostic control: keep SACK and the same loss, but disable RACK
          # loss detection/recovery by setting TCPRecovery(0).
          - scenario: lossy-legacy
            loss: '0.10%'
            recovery: legacy
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false

      - name: Install benchmark tools
        run: |
          sudo apt-get update
          sudo apt-get install -y iperf3 iproute2 iptables jq

      - name: Build verified gVisor synthetic-Go baseline
        run: bash ./scripts/build.sh

      - name: Long-fat network benchmark under 128 MiB / no-swap relay budget
        env:
          # ~20 Mbit*second BDP: 100 Mbit/s and ~200 ms RTT.
          RATE: 100mbit
          ONE_WAY_DELAY: 100ms
          LOSS: ${{ matrix.loss }}
          RECOVERY: ${{ matrix.recovery }}
          DURATION: '15'
          # One trial is deliberate while this is a diagnostic matrix. Once
          # recovery behavior is understood, statistical runs can move to a
          # separate performance gate.
          TRIALS: '1'
          TCP_BUFFER_MIB: '8'
          MEMORY_LIMIT_MIB: '128'
          CASE_TIMEOUT: '45'
        run: sudo -E bash ./scripts/bench-long-fat.sh

      - name: Publish benchmark summary
        if: always() && hashFiles('.bench/summary.md') != ''
        run: |
          printf '### Scenario: %s\n\n```text\n' '${{ matrix.scenario }}' >> "$GITHUB_STEP_SUMMARY"
          cat .bench/scenario.txt >> "$GITHUB_STEP_SUMMARY"
          printf '```\n\n### Build provenance\n\n```text\n' >> "$GITHUB_STEP_SUMMARY"
          cat ./bin/gvisor-build.txt >> "$GITHUB_STEP_SUMMARY"
          printf '```\n\n' >> "$GITHUB_STEP_SUMMARY"
          cat .bench/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload benchmark artifacts
        if: always() && hashFiles('.bench/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: long-fat-${{ matrix.scenario }}
          path: |
            .bench/
            bin/gvisor-build.txt
          include-hidden-files: true
          if-no-files-found: ignore
