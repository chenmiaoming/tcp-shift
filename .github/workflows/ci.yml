name: tcp-shift CI

on:
  push:
    branches:
      - main
      - 'feat/gvisor-*'
  pull_request:
  workflow_dispatch:
  schedule:
    # Scheduled workflows run from the default branch once this lands on main.
    - cron: '17 3 * * *'

permissions:
  contents: read

concurrency:
  group: tcp-shift-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gvisor-compatibility:
    name: gVisor compatibility (${{ matrix.track }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - track: verified-go-baseline
            ref: baseline
          - track: upstream-go
            ref: go
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # Use the current stable toolchain so a synthetic-go toolchain bump is
          # detected instead of being hidden behind a stale CI pin.
          go-version: stable
          cache: false

      - name: Build against selected gVisor synthetic-Go track
        shell: bash
        run: |
          if [[ '${{ matrix.ref }}' == go ]]; then
            GVISOR_REF=go bash ./scripts/build.sh
          else
            bash ./scripts/build.sh
          fi

      - name: Report embedded dependency revision
        run: |
          ./bin/tcp-shift --version
          cat ./bin/gvisor-build.txt

      - name: Smoke test CLI
        run: ./bin/tcp-shift --help

  long-fat-benchmark:
    name: Long-fat (${{ matrix.scenario }})
    # Keep recovery scenarios independent. Lossy cases use repeated trials on
    # the same runner so BBR-vs-CUBIC comparisons are not based on a single
    # random netem sample or cross-runner noise.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - scenario: lossless-rack
            loss: '0%'
            recovery: rack
            trials: '1'
          # Stress case: netem loss is currently applied in both directions.
          # This is intentionally named bidir; a data-only-loss performance
          # scenario will be added separately after recovery behavior is stable.
          - scenario: bidir-loss-rack
            loss: '0.10%'
            recovery: rack
            trials: '3'
          - scenario: bidir-loss-legacy
            loss: '0.10%'
            recovery: legacy
            trials: '3'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false

      - name: Install benchmark tools
        run: |
          sudo apt-get update
          sudo apt-get install -y iperf3 iproute2 iptables jq

      - name: Build verified gVisor synthetic-Go baseline
        run: bash ./scripts/build.sh

      - name: Long-fat network benchmark under 128 MiB / no-swap relay budget
        env:
          # ~20 Mbit*second BDP: 100 Mbit/s and ~200 ms RTT.
          RATE: 100mbit
          ONE_WAY_DELAY: 100ms
          LOSS: ${{ matrix.loss }}
          RECOVERY: ${{ matrix.recovery }}
          # netem's default 1000-packet queue is only slightly above the
          # ~833-packet one-way BDP here and unfairly drops MSS-sized Netstack
          # bursts while GSO-compressed native traffic consumes fewer entries.
          NETEM_LIMIT: '10000'
          DURATION: '15'
          TRIALS: ${{ matrix.trials }}
          TCP_BUFFER_MIB: '8'
          MEMORY_LIMIT_MIB: '128'
          CASE_TIMEOUT: '45'
        run: sudo -E bash ./scripts/bench-long-fat.sh

      - name: Publish benchmark summary
        if: always() && hashFiles('.bench/summary.md') != ''
        run: |
          printf '### Scenario: %s\n\n```text\n' '${{ matrix.scenario }}' >> "$GITHUB_STEP_SUMMARY"
          cat .bench/scenario.txt >> "$GITHUB_STEP_SUMMARY"
          printf '```\n\n### Build provenance\n\n```text\n' >> "$GITHUB_STEP_SUMMARY"
          cat ./bin/gvisor-build.txt >> "$GITHUB_STEP_SUMMARY"
          printf '```\n\n' >> "$GITHUB_STEP_SUMMARY"
          cat .bench/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload benchmark artifacts
        if: always() && hashFiles('.bench/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: long-fat-${{ matrix.scenario }}
          path: |
            .bench/
            bin/gvisor-build.txt
          include-hidden-files: true
          if-no-files-found: ignore
