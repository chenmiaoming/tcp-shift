name: RFC 8985 RACK-TLP

on:
  pull_request:
    branches:
      - main
    paths:
      - 'CMakeLists.txt'
      - 'src/lwip/rack_tlp.c'
      - 'src/lwip/rack_tlp.h'
      - 'src/lwip/cc_adapter.c'
      - 'src/lwip/cc_adapter.h'
      - 'src/lwip/cc_hooks.h'
      - 'src/runtime/lwip_loop.c'
      - 'src/runtime/lwip_loop.h'
      - 'src/p2_main.c'
      - 'src/p2_ipv6_main.c'
      - 'patches/lwip-sack-recovery.patch'
      - 'src/tests/rack_tlp_test.c'
      - 'src/tests/rack_tlp_adapter_test.c'
      - 'scripts/p6-bbr-long-flow.sh'
      - 'scripts/p6-bbr-app-limited.sh'
      - 'docs/milestones/rack-tlp.md'
      - '.github/workflows/rack-tlp.yml'
  workflow_dispatch:

jobs:
  rack-tlp-core:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout tcp-shift
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            git \
            iproute2 \
            iptables \
            kmod \
            python3
          sudo modprobe tun || true
          sudo modprobe ifb || true
          test -c /dev/net/tun

      - name: Validate RACK-TLP live harnesses
        run: |
          sh -n scripts/p6-bbr-long-flow.sh
          sh -n scripts/p6-bbr-app-limited.sh

      - name: Enforce SACK evidence / legacy selector boundary
        run: |
          python3 - <<'PY'
          from pathlib import Path

          text = Path("patches/lwip-sack-recovery.patch").read_text()
          start = text.index("+static int\n+tcp_shift_tcp_segment_loss_proven")
          end = text.index("+#endif /* RACK_TLP || LEGACY_SACK_SELECTOR */", start)
          body = text[start:end]
          rack_start = body.index(
              "+#if defined(TCP_SHIFT_EXPERIMENTAL_RACK_TLP) && TCP_SHIFT_EXPERIMENTAL_RACK_TLP"
          )
          legacy_start = body.index(
              "+#elif TCP_SHIFT_EXPERIMENTAL_LEGACY_SACK_SELECTOR", rack_start
          )
          rack_branch = body[rack_start:legacy_start]
          legacy_branch = body[legacy_start:]

          assert "+  return rack_status > 0;" in rack_branch
          assert "sacked_after >= 3U" not in rack_branch
          assert "+  return sacked_after >= 3U;" in legacy_branch
          assert "#if TCP_SHIFT_EXPERIMENTAL_LEGACY_SACK_SELECTOR" in text
          print("sack_recovery_boundary=ok rack=rfc8985 legacy=fixed-count-isolated")
          PY

      - name: Fetch pinned lwIP
        run: sh scripts/fetch-lwip.sh

      - name: Reject invalid RACK/SACK build combinations
        run: |
          if cmake -S . -B .build-rack-no-evidence \
              -DTCP_SHIFT_EXPERIMENTAL_RACK_TLP=ON \
              -DTCP_SHIFT_EXPERIMENTAL_SACK_EVIDENCE=OFF; then
            echo "RACK-TLP configured without mandatory SACK evidence" >&2
            exit 1
          fi
          if cmake -S . -B .build-rack-with-legacy \
              -DTCP_SHIFT_EXPERIMENTAL_RACK_TLP=ON \
              -DTCP_SHIFT_EXPERIMENTAL_SACK_EVIDENCE=ON \
              -DTCP_SHIFT_EXPERIMENTAL_LEGACY_SACK_SELECTOR=ON; then
            echo "RACK-TLP configured with prohibited legacy fixed-count selector" >&2
            exit 1
          fi

      - name: Build SACK evidence without either recovery selector
        run: |
          cmake -S . -B .build-sack-evidence-only \
            -DCMAKE_BUILD_TYPE=Release \
            -DTCP_SHIFT_EXPERIMENTAL_SACK_EVIDENCE=ON
          cmake --build .build-sack-evidence-only --target \
            tcp-shift-p2 \
            tcp-shift-tcp-memory-contract \
            --parallel

      - name: Configure RFC 8985 qualification build
        run: |
          cmake -S . -B .build-rack \
            -DCMAKE_BUILD_TYPE=Release \
            -DTCP_SHIFT_EXPERIMENTAL_SACK_EVIDENCE=ON \
            -DTCP_SHIFT_EXPERIMENTAL_RACK_TLP=ON

      - name: Build RACK-TLP core and production runtime
        run: |
          cmake --build .build-rack --target \
            tcp-shift-rack-tlp-contract \
            tcp-shift-rack-tlp-adapter-contract \
            tcp-shift-p2 \
            tcp-shift-p6-bbr \
            --parallel

      - name: Run RFC 8985 core contract
        run: .build-rack/tcp-shift-rack-tlp-contract

      - name: Run live adapter RACK contract
        run: .build-rack/tcp-shift-rack-tlp-adapter-contract

      - name: Prove timer-driven recovery below DupThresh
        run: |
          out="$PWD/.build/rack-tlp-single-sack"
          sudo env \
            TCP_SHIFT_P6_BBR_LONG_BINARY="$PWD/.build-rack/tcp-shift-p6-bbr" \
            TCP_SHIFT_P6_BBR_LONG_CC=bbr-internal \
            TCP_SHIFT_P6_BBR_LONG_RTT_MS=40 \
            TCP_SHIFT_P6_BBR_LONG_RATE_MBIT=10 \
            TCP_SHIFT_P6_BBR_LONG_PAYLOAD_BYTES=5840 \
            TCP_SHIFT_P6_BBR_LONG_QUEUE_PKTS=64 \
            TCP_SHIFT_P6_BBR_LONG_FAULT_MODE=first-send-loss \
            TCP_SHIFT_P6_BBR_LONG_FAULT_FIRST_PACKET=1 \
            TCP_SHIFT_P6_BBR_LONG_FAULT_MARKER_COUNT=1 \
            TCP_SHIFT_P6_BBR_LONG_FAULT_MARKER_GAP_PACKETS=4 \
            TCP_SHIFT_P6_BBR_LONG_FAULT_MARKER_PREFIX=RACK \
            TCP_SHIFT_P6_BBR_LONG_RECOVERY_EXPECTATION=strict \
            TCP_SHIFT_P6_BBR_LONG_TUN_NAME=tsrack1 \
            TCP_SHIFT_P6_BBR_LONG_IFB_NAME=rackifb1 \
            TCP_SHIFT_P6_BBR_LONG_PUBLIC_PORT=18176 \
            TCP_SHIFT_P6_BBR_LONG_BACKEND_PORT=19176 \
            TCP_SHIFT_P6_BBR_LONG_OUT="$out" \
            sh scripts/p6-bbr-long-flow.sh
          sudo chown -R "$USER:$USER" "$out"
          grep -F 'fault_marker_count=1' "$out/summary.txt"
          grep -F 'retransmit_events=1' "$out/summary.txt"
          grep -F 'timeout_events=0' "$out/summary.txt"

      - name: Prove TLP repairs a true tail loss without RTO
        run: |
          out="$PWD/.build/rack-tlp-tail-loss"
          sudo env \
            TCP_SHIFT_P6_BBR_LONG_BINARY="$PWD/.build-rack/tcp-shift-p6-bbr" \
            TCP_SHIFT_P6_BBR_LONG_CC=bbr-internal \
            TCP_SHIFT_P6_BBR_LONG_RTT_MS=40 \
            TCP_SHIFT_P6_BBR_LONG_RATE_MBIT=10 \
            TCP_SHIFT_P6_BBR_LONG_PAYLOAD_BYTES=5840 \
            TCP_SHIFT_P6_BBR_LONG_QUEUE_PKTS=64 \
            TCP_SHIFT_P6_BBR_LONG_FAULT_MODE=first-send-loss \
            TCP_SHIFT_P6_BBR_LONG_FAULT_FIRST_PACKET=3 \
            TCP_SHIFT_P6_BBR_LONG_FAULT_MARKER_COUNT=1 \
            TCP_SHIFT_P6_BBR_LONG_FAULT_MARKER_GAP_PACKETS=4 \
            TCP_SHIFT_P6_BBR_LONG_FAULT_MARKER_PREFIX=TLPX \
            TCP_SHIFT_P6_BBR_LONG_RECOVERY_EXPECTATION=tlp \
            TCP_SHIFT_P6_BBR_LONG_TUN_NAME=tstlp1 \
            TCP_SHIFT_P6_BBR_LONG_IFB_NAME=tlpifb1 \
            TCP_SHIFT_P6_BBR_LONG_PUBLIC_PORT=18177 \
            TCP_SHIFT_P6_BBR_LONG_BACKEND_PORT=19177 \
            TCP_SHIFT_P6_BBR_LONG_OUT="$out" \
            sh scripts/p6-bbr-long-flow.sh
          sudo chown -R "$USER:$USER" "$out"
          grep -F 'fault_marker_count=1' "$out/summary.txt"
          grep -F 'retransmit_events=1' "$out/summary.txt"
          grep -F 'timeout_events=0' "$out/summary.txt"

      - name: Prove app-limited tail loss is repaired before new data
        run: |
          out="$PWD/.build/rack-tlp-app-limited-tail-loss"
          sudo env \
            TCP_SHIFT_P6_BBR_APP_BINARY="$PWD/.build-rack/tcp-shift-p6-bbr" \
            TCP_SHIFT_P6_BBR_APP_RTT_MS=40 \
            TCP_SHIFT_P6_BBR_APP_RATE_MBIT=10 \
            TCP_SHIFT_P6_BBR_APP_BURST_BYTES=131072 \
            TCP_SHIFT_P6_BBR_APP_IDLE_MS=1000 \
            TCP_SHIFT_P6_BBR_APP_QUEUE_PKTS=280 \
            TCP_SHIFT_P6_BBR_APP_FAULT_MODE=tail-loss \
            TCP_SHIFT_P6_BBR_APP_RECOVERY_EXPECTATION=app-tail \
            TCP_SHIFT_P6_BBR_APP_TUN_NAME=tsrackapp \
            TCP_SHIFT_P6_BBR_APP_IFB_NAME=rackifbapp \
            TCP_SHIFT_P6_BBR_APP_PUBLIC_PORT=18182 \
            TCP_SHIFT_P6_BBR_APP_BACKEND_PORT=19182 \
            TCP_SHIFT_P6_BBR_APP_OUT="$out" \
            sh scripts/p6-bbr-app-limited.sh
          sudo chown -R "$USER:$USER" "$out"
          grep -F 'fault_mode=tail-loss' "$out/summary.txt"
          grep -F 'recovery_expectation=app-tail' "$out/summary.txt"
          grep -F 'fault_drops=1' "$out/summary.txt"
          grep -F 'repair_before_second_burst=1' "$out/summary.txt"
          grep -F 'loss_events=1' "$out/summary.txt"
          grep -F 'timeout_events=0' "$out/summary.txt"
          grep -F 'qdisc_drops=0/0' "$out/summary.txt"

      - name: Prove clean long-RTT RACK stays lossless
        run: |
          out="$PWD/.build/rack-tlp-clean-long-rtt"
          sudo env \
            TCP_SHIFT_P6_BBR_LONG_BINARY="$PWD/.build-rack/tcp-shift-p6-bbr" \
            TCP_SHIFT_P6_BBR_LONG_CC=bbr-internal \
            TCP_SHIFT_P6_BBR_LONG_RTT_MS=260 \
            TCP_SHIFT_P6_BBR_LONG_RATE_MBIT=10 \
            TCP_SHIFT_P6_BBR_LONG_PAYLOAD_BYTES=2097152 \
            TCP_SHIFT_P6_BBR_LONG_QUEUE_PKTS=1784 \
            TCP_SHIFT_P6_BBR_LONG_FAULT_MODE=none \
            TCP_SHIFT_P6_BBR_LONG_TUN_NAME=tsrackclean \
            TCP_SHIFT_P6_BBR_LONG_IFB_NAME=rackifbclean \
            TCP_SHIFT_P6_BBR_LONG_PUBLIC_PORT=18179 \
            TCP_SHIFT_P6_BBR_LONG_BACKEND_PORT=19179 \
            TCP_SHIFT_P6_BBR_LONG_OUT="$out" \
            sh scripts/p6-bbr-long-flow.sh
          sudo chown -R "$USER:$USER" "$out"
          grep -F 'loss_mode=none' "$out/summary.txt"
          grep -F 'retransmit_events=0' "$out/summary.txt"
          grep -F 'loss_events=0' "$out/summary.txt"
          grep -F 'timeout_events=0' "$out/summary.txt"
          grep -F 'qdisc_drops=0/0' "$out/summary.txt"

      - name: Prove RACK repairs a lost retransmission without RTO
        run: |
          out="$PWD/.build/rack-tlp-lost-retransmission"
          sudo env \
            TCP_SHIFT_P6_BBR_LONG_BINARY="$PWD/.build-rack/tcp-shift-p6-bbr" \
            TCP_SHIFT_P6_BBR_LONG_CC=bbr-internal \
            TCP_SHIFT_P6_BBR_LONG_RTT_MS=260 \
            TCP_SHIFT_P6_BBR_LONG_RATE_MBIT=10 \
            TCP_SHIFT_P6_BBR_LONG_PAYLOAD_BYTES=2097152 \
            TCP_SHIFT_P6_BBR_LONG_QUEUE_PKTS=1784 \
            TCP_SHIFT_P6_BBR_LONG_FAULT_MODE=lost-retransmission \
            TCP_SHIFT_P6_BBR_LONG_FAULT_FIRST_PACKET=80 \
            TCP_SHIFT_P6_BBR_LONG_FAULT_SECOND_PACKET=84 \
            TCP_SHIFT_P6_BBR_LONG_RECOVERY_EXPECTATION=rack \
            TCP_SHIFT_P6_BBR_LONG_TUN_NAME=tsrackrtx \
            TCP_SHIFT_P6_BBR_LONG_IFB_NAME=rackifbrtx \
            TCP_SHIFT_P6_BBR_LONG_PUBLIC_PORT=18178 \
            TCP_SHIFT_P6_BBR_LONG_BACKEND_PORT=19178 \
            TCP_SHIFT_P6_BBR_LONG_OUT="$out" \
            sh scripts/p6-bbr-long-flow.sh
          sudo chown -R "$USER:$USER" "$out"
          grep -F 'loss_mode=deterministic-lost-retransmission' "$out/summary.txt"
          grep -F 'recovery_expectation=rack' "$out/summary.txt"
          grep -F 'fault_drops=3' "$out/summary.txt"
          grep -F 'retransmit_events=3' "$out/summary.txt"
          grep -F 'loss_events=2' "$out/summary.txt"
          grep -F 'timeout_events=0' "$out/summary.txt"

      - name: Prove deterministic 28-drop RACK recovery stays exact
        run: |
          out="$PWD/.build/rack-tlp-first-send-28"
          sudo env \
            TCP_SHIFT_P6_BBR_LONG_BINARY="$PWD/.build-rack/tcp-shift-p6-bbr" \
            TCP_SHIFT_P6_BBR_LONG_CC=bbr-internal \
            TCP_SHIFT_P6_BBR_LONG_RTT_MS=260 \
            TCP_SHIFT_P6_BBR_LONG_RATE_MBIT=10 \
            TCP_SHIFT_P6_BBR_LONG_PAYLOAD_BYTES=4194304 \
            TCP_SHIFT_P6_BBR_LONG_QUEUE_PKTS=1784 \
            TCP_SHIFT_P6_BBR_LONG_FAULT_MODE=first-send-loss \
            TCP_SHIFT_P6_BBR_LONG_FAULT_FIRST_PACKET=80 \
            TCP_SHIFT_P6_BBR_LONG_FAULT_MARKER_COUNT=28 \
            TCP_SHIFT_P6_BBR_LONG_FAULT_MARKER_GAP_PACKETS=96 \
            TCP_SHIFT_P6_BBR_LONG_FAULT_MARKER_PREFIX=RACK28 \
            TCP_SHIFT_P6_BBR_LONG_RECOVERY_EXPECTATION=strict \
            TCP_SHIFT_P6_BBR_LONG_TUN_NAME=tsrack28 \
            TCP_SHIFT_P6_BBR_LONG_IFB_NAME=rackifb28 \
            TCP_SHIFT_P6_BBR_LONG_PUBLIC_PORT=18183 \
            TCP_SHIFT_P6_BBR_LONG_BACKEND_PORT=19183 \
            TCP_SHIFT_P6_BBR_LONG_OUT="$out" \
            sh scripts/p6-bbr-long-flow.sh
          sudo chown -R "$USER:$USER" "$out"
          grep -F 'loss_mode=deterministic-first-send' "$out/summary.txt"
          grep -F 'fault_marker_count=28' "$out/summary.txt"
          grep -F 'fault_drops=28' "$out/summary.txt"
          grep -F 'retransmit_events=28' "$out/summary.txt"
          grep -F 'rack_reordering_events=0' "$out/summary.txt"
          grep -F 'timeout_events=0' "$out/summary.txt"
          grep -F 'qdisc_drops=0/0' "$out/summary.txt"
          grep -F 'payload_integrity=ok' "$out/summary.txt"

      - name: Prove Reno survives deterministic 28-drop RACK recovery
        run: |
          out="$PWD/.build/rack-tlp-first-send-28-reno"
          sudo env \
            TCP_SHIFT_P6_BBR_LONG_BINARY="$PWD/.build-rack/tcp-shift-p2" \
            TCP_SHIFT_P6_BBR_LONG_CC=reno \
            TCP_SHIFT_P6_BBR_LONG_RTT_MS=260 \
            TCP_SHIFT_P6_BBR_LONG_RATE_MBIT=10 \
            TCP_SHIFT_P6_BBR_LONG_PAYLOAD_BYTES=4194304 \
            TCP_SHIFT_P6_BBR_LONG_QUEUE_PKTS=1784 \
            TCP_SHIFT_P6_BBR_LONG_FAULT_MODE=first-send-loss \
            TCP_SHIFT_P6_BBR_LONG_FAULT_FIRST_PACKET=80 \
            TCP_SHIFT_P6_BBR_LONG_FAULT_MARKER_COUNT=28 \
            TCP_SHIFT_P6_BBR_LONG_FAULT_MARKER_GAP_PACKETS=96 \
            TCP_SHIFT_P6_BBR_LONG_FAULT_MARKER_PREFIX=RACKR \
            TCP_SHIFT_P6_BBR_LONG_RECOVERY_EXPECTATION=strict \
            TCP_SHIFT_P6_BBR_LONG_TUN_NAME=tsrack28r \
            TCP_SHIFT_P6_BBR_LONG_IFB_NAME=rackifb28r \
            TCP_SHIFT_P6_BBR_LONG_PUBLIC_PORT=18184 \
            TCP_SHIFT_P6_BBR_LONG_BACKEND_PORT=19184 \
            TCP_SHIFT_P6_BBR_LONG_OUT="$out" \
            sh scripts/p6-bbr-long-flow.sh
          sudo chown -R "$USER:$USER" "$out"
          grep -F 'cc=reno' "$out/summary.txt"
          grep -F 'fault_drops=28' "$out/summary.txt"
          grep -F 'retransmit_events=28' "$out/summary.txt"
          grep -E 'tcp-shift-p2-delivery: .*sack_events=[1-9][0-9]*' "$out/runtime.stderr"
          grep -F 'rack_reordering_events=0' "$out/summary.txt"
          grep -F 'timeout_events=0' "$out/summary.txt"
          grep -F 'qdisc_drops=0/0' "$out/summary.txt"
          grep -F 'payload_integrity=ok' "$out/summary.txt"

      - name: Prove CUBIC survives deterministic 28-drop RACK recovery
        run: |
          out="$PWD/.build/rack-tlp-first-send-28-cubic"
          sudo env \
            TCP_SHIFT_P6_BBR_LONG_BINARY="$PWD/.build-rack/tcp-shift-p2" \
            TCP_SHIFT_P6_BBR_LONG_CC=cubic \
            TCP_SHIFT_P6_BBR_LONG_RTT_MS=260 \
            TCP_SHIFT_P6_BBR_LONG_RATE_MBIT=10 \
            TCP_SHIFT_P6_BBR_LONG_PAYLOAD_BYTES=4194304 \
            TCP_SHIFT_P6_BBR_LONG_QUEUE_PKTS=1784 \
            TCP_SHIFT_P6_BBR_LONG_FAULT_MODE=first-send-loss \
            TCP_SHIFT_P6_BBR_LONG_FAULT_FIRST_PACKET=80 \
            TCP_SHIFT_P6_BBR_LONG_FAULT_MARKER_COUNT=28 \
            TCP_SHIFT_P6_BBR_LONG_FAULT_MARKER_GAP_PACKETS=96 \
            TCP_SHIFT_P6_BBR_LONG_FAULT_MARKER_PREFIX=RACKC \
            TCP_SHIFT_P6_BBR_LONG_RECOVERY_EXPECTATION=strict \
            TCP_SHIFT_P6_BBR_LONG_TUN_NAME=tsrack28c \
            TCP_SHIFT_P6_BBR_LONG_IFB_NAME=rackifb28c \
            TCP_SHIFT_P6_BBR_LONG_PUBLIC_PORT=18185 \
            TCP_SHIFT_P6_BBR_LONG_BACKEND_PORT=19185 \
            TCP_SHIFT_P6_BBR_LONG_OUT="$out" \
            sh scripts/p6-bbr-long-flow.sh
          sudo chown -R "$USER:$USER" "$out"
          grep -F 'cc=cubic' "$out/summary.txt"
          grep -F 'fault_drops=28' "$out/summary.txt"
          grep -F 'retransmit_events=28' "$out/summary.txt"
          grep -E 'tcp-shift-p2-delivery: .*sack_events=[1-9][0-9]*' "$out/runtime.stderr"
          grep -F 'rack_reordering_events=0' "$out/summary.txt"
          grep -F 'timeout_events=0' "$out/summary.txt"
          grep -F 'qdisc_drops=0/0' "$out/summary.txt"
          grep -F 'payload_integrity=ok' "$out/summary.txt"

      - name: Prove reordering below reo_wnd causes no recovery
        run: |
          out="$PWD/.build/rack-tlp-reorder-safe"
          sudo env \
            TCP_SHIFT_P6_BBR_LONG_BINARY="$PWD/.build-rack/tcp-shift-p6-bbr" \
            TCP_SHIFT_P6_BBR_LONG_CC=bbr-internal \
            TCP_SHIFT_P6_BBR_LONG_RTT_MS=80 \
            TCP_SHIFT_P6_BBR_LONG_RATE_MBIT=10 \
            TCP_SHIFT_P6_BBR_LONG_PAYLOAD_BYTES=262144 \
            TCP_SHIFT_P6_BBR_LONG_QUEUE_PKTS=256 \
            TCP_SHIFT_P6_BBR_LONG_FAULT_MODE=reorder \
            TCP_SHIFT_P6_BBR_LONG_REORDER_DELAY_MS=5 \
            TCP_SHIFT_P6_BBR_LONG_REORDER_GAP=4 \
            TCP_SHIFT_P6_BBR_LONG_RECOVERY_EXPECTATION=reorder-safe \
            TCP_SHIFT_P6_BBR_LONG_TUN_NAME=tsracksafe \
            TCP_SHIFT_P6_BBR_LONG_IFB_NAME=rackifbsafe \
            TCP_SHIFT_P6_BBR_LONG_PUBLIC_PORT=18180 \
            TCP_SHIFT_P6_BBR_LONG_BACKEND_PORT=19180 \
            TCP_SHIFT_P6_BBR_LONG_OUT="$out" \
            sh scripts/p6-bbr-long-flow.sh
          sudo chown -R "$USER:$USER" "$out"
          grep -F 'loss_mode=deterministic-reorder' "$out/summary.txt"
          grep -F 'recovery_expectation=reorder-safe' "$out/summary.txt"
          grep -F 'retransmit_events=0' "$out/summary.txt"
          grep -F 'loss_events=0' "$out/summary.txt"
          grep -F 'timeout_events=0' "$out/summary.txt"
          grep -F 'qdisc_drops=0/0' "$out/summary.txt"

      - name: Prove reordering beyond reo_wnd produces D-SACK adaptation
        run: |
          sudo sysctl -w net.ipv4.tcp_dsack=1
          out="$PWD/.build/rack-tlp-reorder-dsack"
          sudo env \
            TCP_SHIFT_P6_BBR_LONG_BINARY="$PWD/.build-rack/tcp-shift-p6-bbr" \
            TCP_SHIFT_P6_BBR_LONG_CC=bbr-internal \
            TCP_SHIFT_P6_BBR_LONG_RTT_MS=80 \
            TCP_SHIFT_P6_BBR_LONG_RATE_MBIT=10 \
            TCP_SHIFT_P6_BBR_LONG_PAYLOAD_BYTES=32768 \
            TCP_SHIFT_P6_BBR_LONG_QUEUE_PKTS=256 \
            TCP_SHIFT_P6_BBR_LONG_FAULT_MODE=reorder \
            TCP_SHIFT_P6_BBR_LONG_REORDER_DELAY_MS=30 \
            TCP_SHIFT_P6_BBR_LONG_REORDER_GAP=2 \
            TCP_SHIFT_P6_BBR_LONG_RECOVERY_EXPECTATION=dsack \
            TCP_SHIFT_P6_BBR_LONG_TUN_NAME=tsrackdsack \
            TCP_SHIFT_P6_BBR_LONG_IFB_NAME=rackifbdsack \
            TCP_SHIFT_P6_BBR_LONG_PUBLIC_PORT=18181 \
            TCP_SHIFT_P6_BBR_LONG_BACKEND_PORT=19181 \
            TCP_SHIFT_P6_BBR_LONG_OUT="$out" \
            sh scripts/p6-bbr-long-flow.sh
          sudo chown -R "$USER:$USER" "$out"
          grep -F 'loss_mode=deterministic-reorder' "$out/summary.txt"
          grep -F 'recovery_expectation=dsack' "$out/summary.txt"
          grep -E 'rack_dsack_events=[1-9][0-9]*' "$out/summary.txt"
          grep -E 'rack_reo_wnd_mult_max=([2-9]|[1-9][0-9]+)' "$out/summary.txt"
          grep -F 'timeout_events=0' "$out/summary.txt"
          grep -F 'qdisc_drops=0/0' "$out/summary.txt"

      - name: Record qualification boundary
        run: |
          {
            echo "## RFC 8985 RACK-TLP"
            echo
            echo '~~~text'
            .build-rack/tcp-shift-rack-tlp-contract
            .build-rack/tcp-shift-rack-tlp-adapter-contract
            if [ -f .build/rack-tlp-single-sack/summary.txt ]; then
              cat .build/rack-tlp-single-sack/summary.txt
            fi
            if [ -f .build/rack-tlp-tail-loss/summary.txt ]; then
              cat .build/rack-tlp-tail-loss/summary.txt
            fi
            if [ -f .build/rack-tlp-app-limited-tail-loss/summary.txt ]; then
              cat .build/rack-tlp-app-limited-tail-loss/summary.txt
            fi
            if [ -f .build/rack-tlp-clean-long-rtt/summary.txt ]; then
              cat .build/rack-tlp-clean-long-rtt/summary.txt
            fi
            if [ -f .build/rack-tlp-lost-retransmission/summary.txt ]; then
              cat .build/rack-tlp-lost-retransmission/summary.txt
            fi
            if [ -f .build/rack-tlp-first-send-28/summary.txt ]; then
              cat .build/rack-tlp-first-send-28/summary.txt
            fi
            if [ -f .build/rack-tlp-first-send-28-reno/summary.txt ]; then
              cat .build/rack-tlp-first-send-28-reno/summary.txt
            fi
            if [ -f .build/rack-tlp-first-send-28-cubic/summary.txt ]; then
              cat .build/rack-tlp-first-send-28-cubic/summary.txt
            fi
            if [ -f .build/rack-tlp-reorder-safe/summary.txt ]; then
              cat .build/rack-tlp-reorder-safe/summary.txt
            fi
            if [ -f .build/rack-tlp-reorder-dsack/summary.txt ]; then
              cat .build/rack-tlp-reorder-dsack/summary.txt
            fi
            echo '~~~'
            echo
            echo "Runtime behavior remains experimental/default-OFF pending teardown and resource-cost qualification."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload RACK-TLP diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rack-tlp-qualification
          path: |
            .build/rack-tlp-single-sack
            .build/rack-tlp-tail-loss
            .build/rack-tlp-app-limited-tail-loss
            .build/rack-tlp-clean-long-rtt
            .build/rack-tlp-lost-retransmission
            .build/rack-tlp-first-send-28
            .build/rack-tlp-first-send-28-reno
            .build/rack-tlp-first-send-28-cubic
            .build/rack-tlp-reorder-safe
            .build/rack-tlp-reorder-dsack
          if-no-files-found: warn
          include-hidden-files: true
