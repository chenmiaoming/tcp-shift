name: P6 BBR Linux reference

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/p6-bbr-reference.yml'
      - 'scripts/p6-bbr-long-flow.sh'
      - 'scripts/p6-bbr-multiflow.sh'
      - 'scripts/p6-bbr-app-limited.sh'
      - 'scripts/linux-cubic-pacing-reference.sh'
      - 'scripts/linux-bbr-multiflow-reference.sh'
      - 'scripts/p6-bbr-reference-evaluate.py'
      - 'scripts/p6-bbr-multiflow-evaluate.py'
      - 'scripts/p6-bbr-loss-reference-evaluate.py'
      - 'scripts/p6-bbr-loss-same-stack-evaluate.py'
      - 'scripts/p6-bbr-first-send-loss-evaluate.py'
      - 'scripts/p6-first-send-controller-matrix-evaluate.py'
      - 'scripts/p6-cubic-pacing-ab-evaluate.py'
      - 'scripts/p6-cubic-preloss-ack-evaluate.py'
      - 'scripts/p6-cubic-postloss-trajectory-evaluate.py'
      - 'scripts/p6-cubic-rfc9438-growth-audit.py'
      - 'scripts/p6-cubic-loss-reduction-audit.py'
      - 'scripts/p6-cubic-fast-convergence-ab-evaluate.py'
      - 'scripts/p6-cubic-multiflow-fast-convergence-ab-evaluate.py'
      - 'scripts/p6-cubic-single-flow-residual-evaluate.py'
      - 'src/cc/**'
      - 'src/lwip/**'
      - 'src/runtime/**'
      - 'src/bridge/**'
      - 'src/p2_main.c'
      - 'src/lwipopts.h'
      - 'CMakeLists.txt'
      - 'scripts/fetch-lwip.sh'
      - 'patches/lwip-p4-cc-hooks.patch'
      - 'patches/lwip-sack-recovery.patch'
      - '.lwip-baseline'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sack-layout-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout tcp-shift
        uses: actions/checkout@v4

      - name: Install layout-contract dependencies
        run: |
          sudo apt-get update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            git \
            python3

      - name: Build default and sender-SACK layouts
        run: |
          sh scripts/fetch-lwip.sh
          cmake -S . -B .build-sack-layout-default -DCMAKE_BUILD_TYPE=Release
          cmake --build .build-sack-layout-default --target tcp-shift-tcp-memory-contract --parallel
          cmake -S . -B .build-sack-layout-on -DCMAKE_BUILD_TYPE=Release -DTCP_SHIFT_EXPERIMENTAL_SACK_EVIDENCE=ON
          cmake --build .build-sack-layout-on --target tcp-shift-tcp-memory-contract --parallel
          .build-sack-layout-default/tcp-shift-tcp-memory-contract | tee .build/sack-layout-default.txt
          .build-sack-layout-on/tcp-shift-tcp-memory-contract | tee .build/sack-layout-on.txt

      - name: Compare sender-SACK layout cost
        run: |
          python3 - <<'PY' | tee .build/sack-layout-comparison.txt
          import re
          from pathlib import Path

          pattern = re.compile(
              r"tcp_memory_layout=ok sack_out=(\d+) pcb_bytes=(\d+) seg_bytes=(\d+)"
          )

          def read(path):
              match = pattern.search(Path(path).read_text())
              if not match:
                  raise SystemExit(f"missing layout record: {path}")
              return tuple(map(int, match.groups()))

          off = read(".build/sack-layout-default.txt")
          on = read(".build/sack-layout-on.txt")
          if off[0] != 0 or on[0] != 1:
              raise SystemExit(f"unexpected SACK compile states: off={off[0]} on={on[0]}")
          if on[2] != off[2]:
              raise SystemExit(
                  f"sender SACK changed tcp_seg size: off={off[2]} on={on[2]}"
              )
          delta = on[1] - off[1]
          if delta <= 0 or delta > 32:
              raise SystemExit(
                  f"unexpected tcp_pcb SACK layout delta: off={off[1]} on={on[1]} delta={delta}"
              )
          print(
              "sack_layout_contract=ok "
              f"pcb_off_bytes={off[1]} pcb_on_bytes={on[1]} pcb_delta_bytes={delta} "
              f"seg_off_bytes={off[2]} seg_on_bytes={on[2]}"
          )
          PY

      - name: Publish sender-SACK layout evidence
        if: always()
        run: |
          {
            echo "## Experimental sender-SACK layout"
            echo
            for file in .build/sack-layout-default.txt .build/sack-layout-on.txt .build/sack-layout-comparison.txt; do
              if [ -f "$file" ]; then
                echo '~~~text'
                cat "$file"
                echo '~~~'
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload sender-SACK layout evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p6-sack-layout-contract
          path: |
            .build/sack-layout-default.txt
            .build/sack-layout-on.txt
            .build/sack-layout-comparison.txt
          if-no-files-found: error

  single-flow-reference:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - case: low-bdp
            rtt_ms: 10
            rate_mbit: 20
            payload_bytes: 8388608
            queue_pkts: 144
          - case: edge-bdp
            rtt_ms: 40
            rate_mbit: 10
            payload_bytes: 8388608
            queue_pkts: 280
          - case: high-bdp
            rtt_ms: 100
            rate_mbit: 50
            payload_bytes: 33554432
            queue_pkts: 3432

    steps:
      - name: Checkout tcp-shift
        uses: actions/checkout@v4

      - name: Install BBR reference dependencies
        run: |
          sudo apt-get update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            ethtool \
            git \
            iproute2 \
            iptables \
            kmod \
            python3
          sudo modprobe tun || true
          sudo modprobe ifb || true
          sudo modprobe tcp_bbr || true
          test -c /dev/net/tun
          sysctl net.ipv4.tcp_available_congestion_control

      - name: Validate BBR reference harnesses
        run: |
          sh -n scripts/p6-bbr-long-flow.sh
          sh -n scripts/linux-cubic-pacing-reference.sh
          python3 -m py_compile scripts/p6-bbr-reference-evaluate.py

      - name: Build internal BBR qualification target
        run: |
          sh scripts/fetch-lwip.sh
          cmake -S . -B .build-p6-bbr-reference -DCMAKE_BUILD_TYPE=Release
          cmake --build .build-p6-bbr-reference --target tcp-shift-p6-bbr --parallel

      - name: Run tcp-shift internal BBR clean flow
        run: |
          out="$PWD/.build/p6-bbr-reference/${{ matrix.case }}/tcp-shift"
          sudo env \
            TCP_SHIFT_P6_BBR_LONG_BINARY="$PWD/.build-p6-bbr-reference/tcp-shift-p6-bbr" \
            TCP_SHIFT_P6_BBR_LONG_RTT_MS="${{ matrix.rtt_ms }}" \
            TCP_SHIFT_P6_BBR_LONG_RATE_MBIT="${{ matrix.rate_mbit }}" \
            TCP_SHIFT_P6_BBR_LONG_PAYLOAD_BYTES="${{ matrix.payload_bytes }}" \
            TCP_SHIFT_P6_BBR_LONG_QUEUE_PKTS="${{ matrix.queue_pkts }}" \
            TCP_SHIFT_P6_BBR_LONG_OUT="$out" \
            sh scripts/p6-bbr-long-flow.sh

      - name: Run Linux tcp_bbr reference
        run: |
          out="$PWD/.build/p6-bbr-reference/${{ matrix.case }}/linux-bbr"
          sudo env \
            TCP_SHIFT_LINUX_PACING_CC=bbr \
            TCP_SHIFT_LINUX_PACING_CASE="${{ matrix.case }}" \
            TCP_SHIFT_LINUX_PACING_MODE=fq \
            TCP_SHIFT_LINUX_PACING_RTT_MS="${{ matrix.rtt_ms }}" \
            TCP_SHIFT_LINUX_PACING_RATE_MBIT="${{ matrix.rate_mbit }}" \
            TCP_SHIFT_LINUX_PACING_PAYLOAD_BYTES="${{ matrix.payload_bytes }}" \
            TCP_SHIFT_LINUX_PACING_QUEUE_PKTS="${{ matrix.queue_pkts }}" \
            TCP_SHIFT_LINUX_PACING_REQUIRE_ZERO_DROPS=1 \
            TCP_SHIFT_LINUX_PACING_OUT="$out" \
            sh scripts/linux-cubic-pacing-reference.sh

      - name: Compare tcp-shift BBR with Linux reference
        run: |
          root="$PWD/.build/p6-bbr-reference/${{ matrix.case }}"
          sudo chown -R "$USER:$USER" "$root"
          python3 scripts/p6-bbr-reference-evaluate.py \
            "${{ matrix.case }}" \
            "$root/tcp-shift/summary.txt" \
            "$root/linux-bbr/summary.txt" \
            | tee "$root/comparison.txt"

      - name: Publish BBR reference evidence
        if: always()
        run: |
          root=".build/p6-bbr-reference/${{ matrix.case }}"
          {
            echo "## P6 BBR reference: ${{ matrix.case }}"
            echo
            echo "RTT=${{ matrix.rtt_ms }}ms rate=${{ matrix.rate_mbit }}Mbit payload=${{ matrix.payload_bytes }} bytes queue=${{ matrix.queue_pkts }} packets"
            echo "Linux reference uses tcp_bbr with sch_fq on the sender and receiver-side IFB/netem shaping."
            for file in "$root/tcp-shift/summary.txt" "$root/cubic/summary.txt" \
              "$root/same-stack-comparison.txt" "$root/linux-bbr/summary.txt" "$root/comparison.txt"; do
              if [ -f "$file" ]; then
                echo
                echo '~~~text'
                cat "$file"
                echo '~~~'
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload BBR reference diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p6-bbr-reference-${{ matrix.case }}
          path: .build/p6-bbr-reference/${{ matrix.case }}
          if-no-files-found: warn
          include-hidden-files: true

  multiflow-reference:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout tcp-shift
        uses: actions/checkout@v4

      - name: Install multi-flow dependencies
        run: |
          sudo apt-get update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            ethtool \
            git \
            iproute2 \
            kmod \
            python3
          sudo modprobe tun || true
          sudo modprobe ifb || true
          test -c /dev/net/tun

      - name: Validate multi-flow harnesses
        run: |
          sh -n scripts/p6-bbr-multiflow.sh
          sh -n scripts/linux-bbr-multiflow-reference.sh
          python3 -m py_compile scripts/p6-bbr-multiflow-evaluate.py

      - name: Build internal BBR qualification target
        run: |
          sh scripts/fetch-lwip.sh
          cmake -S . -B .build-p6-bbr-multiflow -DCMAKE_BUILD_TYPE=Release
          cmake --build .build-p6-bbr-multiflow --target tcp-shift-p6-bbr --parallel

      - name: Run repeated internal BBR flows on one bottleneck
        run: |
          status=0
          for run in 1 2 3; do
            if [ "$run" -eq 1 ]; then
              out="$PWD/.build/p6-bbr-multiflow/edge-bdp"
            else
              out="$PWD/.build/p6-bbr-multiflow/edge-bdp-repeat-$run"
            fi
            echo "P6 BBR multi-flow stability run $run/3 -> $out"
            if ! sudo env \
              TCP_SHIFT_P6_BBR_MULTI_BINARY="$PWD/.build-p6-bbr-multiflow/tcp-shift-p6-bbr" \
              TCP_SHIFT_P6_BBR_MULTI_FLOWS=4 \
              TCP_SHIFT_P6_BBR_MULTI_RTT_MS=40 \
              TCP_SHIFT_P6_BBR_MULTI_RATE_MBIT=10 \
              TCP_SHIFT_P6_BBR_MULTI_PAYLOAD_BYTES=2097152 \
              TCP_SHIFT_P6_BBR_MULTI_QUEUE_PKTS=280 \
              TCP_SHIFT_P6_BBR_MULTI_OUT="$out" \
              sh scripts/p6-bbr-multiflow.sh; then
              status=1
            fi
          done
          exit "$status"

      - name: Run four Linux BBR flows on the same path model
        run: |
          sudo env \
            TCP_SHIFT_LINUX_BBR_MULTI_FLOWS=4 \
            TCP_SHIFT_LINUX_BBR_MULTI_RTT_MS=40 \
            TCP_SHIFT_LINUX_BBR_MULTI_RATE_MBIT=10 \
            TCP_SHIFT_LINUX_BBR_MULTI_PAYLOAD_BYTES=2097152 \
            TCP_SHIFT_LINUX_BBR_MULTI_QUEUE_PKTS=280 \
            TCP_SHIFT_LINUX_BBR_MULTI_OUT="$PWD/.build/linux-bbr-multiflow/edge-bdp" \
            sh scripts/linux-bbr-multiflow-reference.sh

      - name: Compare multi-flow behavior
        run: |
          sudo chown -R "$USER:$USER" \
            "$PWD/.build/p6-bbr-multiflow/edge-bdp" \
            "$PWD/.build/linux-bbr-multiflow/edge-bdp"
          python3 scripts/p6-bbr-multiflow-evaluate.py \
            "$PWD/.build/p6-bbr-multiflow/edge-bdp/summary.txt" \
            "$PWD/.build/linux-bbr-multiflow/edge-bdp/summary.txt" \
            | tee "$PWD/.build/p6-bbr-multiflow/edge-bdp/comparison.txt"

      - name: Publish multi-flow evidence
        if: always()
        run: |
          {
            echo "## P6 BBR multi-flow reference"
            for file in \
              .build/p6-bbr-multiflow/edge-bdp/summary.txt \
              .build/p6-bbr-multiflow/edge-bdp-repeat-2/summary.txt \
              .build/p6-bbr-multiflow/edge-bdp-repeat-3/summary.txt \
              .build/linux-bbr-multiflow/edge-bdp/summary.txt \
              .build/p6-bbr-multiflow/edge-bdp/comparison.txt; do
              if [ -f "$file" ]; then
                echo
                echo '~~~text'
                cat "$file"
                echo '~~~'
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload multi-flow diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p6-bbr-multiflow-edge-bdp
          path: |
            .build/p6-bbr-multiflow/edge-bdp
            .build/p6-bbr-multiflow/edge-bdp-repeat-2
            .build/p6-bbr-multiflow/edge-bdp-repeat-3
            .build/linux-bbr-multiflow/edge-bdp
          if-no-files-found: warn
          include-hidden-files: true

  cubic-fast-convergence-multiflow-reference:
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Checkout tcp-shift
        uses: actions/checkout@v4

      - name: Install CUBIC multi-flow dependencies
        run: |
          sudo apt-get update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            ethtool \
            git \
            iproute2 \
            iptables \
            kmod \
            python3
          sudo modprobe tun || true
          sudo modprobe ifb || true
          test -c /dev/net/tun

      - name: Validate CUBIC multi-flow harness
        run: |
          sh -n scripts/p6-bbr-multiflow.sh
          python3 -m py_compile scripts/p6-cubic-multiflow-fast-convergence-ab-evaluate.py

      - name: Build CUBIC fast-convergence A/B targets
        run: |
          sh scripts/fetch-lwip.sh
          cmake -S . -B .build-p6-cubic-multiflow \
            -DCMAKE_BUILD_TYPE=Release \
            -DTCP_SHIFT_EXPERIMENTAL_SACK_EVIDENCE=ON \
            -DTCP_SHIFT_EXPERIMENTAL_RACK_TLP=ON
          cmake --build .build-p6-cubic-multiflow \
            --target tcp-shift-p6-cubic-recovery-trace tcp-shift-p6-cubic-single-flow \
            --parallel

      - name: Run default CUBIC deterministic multi-flow loss
        run: |
          out="$PWD/.build/p6-cubic-fast-convergence-multiflow/default"
          sudo env \
            TCP_SHIFT_P6_BBR_MULTI_BINARY="$PWD/.build-p6-cubic-multiflow/tcp-shift-p6-cubic-recovery-trace" \
            TCP_SHIFT_P6_BBR_MULTI_CC=cubic \
            TCP_SHIFT_P6_BBR_MULTI_FLOWS=4 \
            TCP_SHIFT_P6_BBR_MULTI_RTT_MS=40 \
            TCP_SHIFT_P6_BBR_MULTI_RATE_MBIT=10 \
            TCP_SHIFT_P6_BBR_MULTI_PAYLOAD_BYTES=4194304 \
            TCP_SHIFT_P6_BBR_MULTI_QUEUE_PKTS=280 \
            TCP_SHIFT_P6_BBR_MULTI_FAULT_MARKERS_PER_FLOW=8 \
            TCP_SHIFT_P6_BBR_MULTI_FAULT_FIRST_PACKET=128 \
            TCP_SHIFT_P6_BBR_MULTI_FAULT_GAP_PACKETS=256 \
            TCP_SHIFT_P6_BBR_MULTI_FAULT_MARKER_PREFIX=TSMF \
            TCP_SHIFT_P6_BBR_MULTI_TUN_NAME=tsp6mfc0 \
            TCP_SHIFT_P6_BBR_MULTI_IFB_NAME=p6mfcif0 \
            TCP_SHIFT_P6_BBR_MULTI_PUBLIC_PORT=18460 \
            TCP_SHIFT_P6_BBR_MULTI_BACKEND_PORT=19460 \
            TCP_SHIFT_P6_BBR_MULTI_OUT="$out" \
            sh scripts/p6-bbr-multiflow.sh

      - name: Run CUBIC multi-flow with fast convergence disabled
        run: |
          out="$PWD/.build/p6-cubic-fast-convergence-multiflow/no-fast"
          sudo env \
            TCP_SHIFT_P6_BBR_MULTI_BINARY="$PWD/.build-p6-cubic-multiflow/tcp-shift-p6-cubic-single-flow" \
            TCP_SHIFT_P6_BBR_MULTI_CC=cubic \
            TCP_SHIFT_P6_BBR_MULTI_FLOWS=4 \
            TCP_SHIFT_P6_BBR_MULTI_RTT_MS=40 \
            TCP_SHIFT_P6_BBR_MULTI_RATE_MBIT=10 \
            TCP_SHIFT_P6_BBR_MULTI_PAYLOAD_BYTES=4194304 \
            TCP_SHIFT_P6_BBR_MULTI_QUEUE_PKTS=280 \
            TCP_SHIFT_P6_BBR_MULTI_FAULT_MARKERS_PER_FLOW=8 \
            TCP_SHIFT_P6_BBR_MULTI_FAULT_FIRST_PACKET=128 \
            TCP_SHIFT_P6_BBR_MULTI_FAULT_GAP_PACKETS=256 \
            TCP_SHIFT_P6_BBR_MULTI_FAULT_MARKER_PREFIX=TSMF \
            TCP_SHIFT_P6_BBR_MULTI_TUN_NAME=tsp6mfc1 \
            TCP_SHIFT_P6_BBR_MULTI_IFB_NAME=p6mfcif1 \
            TCP_SHIFT_P6_BBR_MULTI_PUBLIC_PORT=18461 \
            TCP_SHIFT_P6_BBR_MULTI_BACKEND_PORT=19461 \
            TCP_SHIFT_P6_BBR_MULTI_OUT="$out" \
            sh scripts/p6-bbr-multiflow.sh

      - name: Compare CUBIC multi-flow fast convergence
        run: |
          root="$PWD/.build/p6-cubic-fast-convergence-multiflow"
          sudo chown -R "$USER:$USER" "$root"
          python3 scripts/p6-cubic-multiflow-fast-convergence-ab-evaluate.py \
            "$root/default/summary.txt" \
            "$root/no-fast/summary.txt" \
            | tee "$root/comparison.txt"

      - name: Publish CUBIC multi-flow fast-convergence evidence
        if: always()
        run: |
          root=.build/p6-cubic-fast-convergence-multiflow
          {
            echo "## CUBIC fast-convergence multi-flow A/B"
            echo
            echo "4 flows, RTT=40ms, rate=10Mbit/s, payload=4MiB/flow, 8 deterministic losses/flow"
            for file in \
              "$root/default/summary.txt" \
              "$root/no-fast/summary.txt" \
              "$root/comparison.txt"; do
              if [ -f "$file" ]; then
                echo
                echo '~~~text'
                cat "$file"
                echo '~~~'
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload CUBIC multi-flow fast-convergence diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p6-cubic-fast-convergence-multiflow
          path: .build/p6-cubic-fast-convergence-multiflow
          if-no-files-found: warn
          include-hidden-files: true

  app-limited-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout tcp-shift
        uses: actions/checkout@v4

      - name: Install app-limited dependencies
        run: |
          sudo apt-get update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            git \
            iproute2 \
            kmod \
            python3
          sudo modprobe tun || true
          sudo modprobe ifb || true
          test -c /dev/net/tun

      - name: Validate app-limited harness
        run: sh -n scripts/p6-bbr-app-limited.sh

      - name: Build internal BBR qualification target
        run: |
          sh scripts/fetch-lwip.sh
          cmake -S . -B .build-p6-bbr-app -DCMAKE_BUILD_TYPE=Release
          cmake --build .build-p6-bbr-app --target tcp-shift-p6-bbr --parallel

      - name: Exercise live app-limited transition
        run: |
          sudo env \
            TCP_SHIFT_P6_BBR_APP_BINARY="$PWD/.build-p6-bbr-app/tcp-shift-p6-bbr" \
            TCP_SHIFT_P6_BBR_APP_RTT_MS=40 \
            TCP_SHIFT_P6_BBR_APP_RATE_MBIT=10 \
            TCP_SHIFT_P6_BBR_APP_BURST_BYTES=524288 \
            TCP_SHIFT_P6_BBR_APP_IDLE_MS=1000 \
            TCP_SHIFT_P6_BBR_APP_QUEUE_PKTS=280 \
            TCP_SHIFT_P6_BBR_APP_OUT="$PWD/.build/p6-bbr-app-limited/edge-bdp" \
            sh scripts/p6-bbr-app-limited.sh

      - name: Publish app-limited evidence
        if: always()
        run: |
          root=.build/p6-bbr-app-limited/edge-bdp
          if [ -f "$root/summary.txt" ]; then
            cat "$root/summary.txt" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload app-limited diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p6-bbr-app-limited-edge-bdp
          path: .build/p6-bbr-app-limited/edge-bdp
          if-no-files-found: warn
          include-hidden-files: true

  moderate-loss-reference:
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout tcp-shift
        uses: actions/checkout@v4

      - name: Install loss-reference dependencies
        run: |
          sudo apt-get update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            ethtool \
            git \
            iproute2 \
            iptables \
            kmod \
            python3
          sudo modprobe tun || true
          sudo modprobe ifb || true
          sudo modprobe tcp_bbr || true
          test -c /dev/net/tun
          sysctl net.ipv4.tcp_available_congestion_control

      - name: Validate random-loss harnesses
        run: |
          sh -n scripts/p6-bbr-long-flow.sh
          sh -n scripts/linux-cubic-pacing-reference.sh
          python3 -m py_compile scripts/p6-bbr-loss-reference-evaluate.py
          python3 -m py_compile scripts/p6-bbr-loss-same-stack-evaluate.py

      - name: Build internal BBR qualification target
        run: |
          sh scripts/fetch-lwip.sh
          cmake -S . -B .build-p6-bbr-loss -DCMAKE_BUILD_TYPE=Release -DTCP_SHIFT_EXPERIMENTAL_SACK_EVIDENCE=ON -DTCP_SHIFT_EXPERIMENTAL_RACK_TLP=ON
          cmake --build .build-p6-bbr-loss --target tcp-shift-p6-bbr tcp-shift-p2 --parallel

      - name: Run tcp-shift BBR with moderate random loss
        run: |
          out="$PWD/.build/p6-bbr-loss/moderate-260ms/tcp-shift"
          sudo env \
            TCP_SHIFT_P6_BBR_LONG_BINARY="$PWD/.build-p6-bbr-loss/tcp-shift-p6-bbr" \
