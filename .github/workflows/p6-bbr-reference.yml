          root="$PWD/.build/p6-bbr-first-send-loss"
          python3 scripts/p6-cubic-postloss-trajectory-evaluate.py \
            "$root/tcp-shift-cubic-single-flow/runtime.stderr" \
            "$root/tcp-shift-cubic-single-flow/summary.txt" \
            "$root/linux-cubic/tcp-info-trace.tsv" \
            "$root/linux-cubic/summary.txt" \
            | tee "$root/cubic-single-flow-postloss-trajectory.txt"

      - name: Audit no-fast single-flow FlightSize loss reduction
        run: |
          set -o pipefail
          root="$PWD/.build/p6-bbr-first-send-loss"
          python3 scripts/p6-cubic-loss-reduction-audit.py \
            "$root/tcp-shift-cubic-single-flow/runtime.stderr" \
            "$root/linux-cubic/tcp-info-trace.tsv" \
            | tee "$root/cubic-single-flow-loss-reduction-audit.txt"

      - name: Compare no-fast single-flow PRR recovery differential
        run: |
          set -o pipefail
          root="$PWD/.build/p6-bbr-first-send-loss"
          python3 scripts/p6-prr-recovery-differential-evaluate.py \
            "$root/tcp-shift-cubic-single-flow/runtime.stderr" \
            "$root/tcp-shift-cubic-single-flow/summary.txt" \
            "$root/linux-cubic/tcp-info.tsv" \
            "$root/linux-cubic/summary.txt" \
            | tee "$root/cubic-single-flow-prr-recovery-differential.txt"

      - name: Summarize no-fast single-flow residual
        run: |
          set -o pipefail
          root="$PWD/.build/p6-bbr-first-send-loss"
          python3 scripts/p6-cubic-single-flow-residual-evaluate.py \
            "$root/tcp-shift-cubic/summary.txt" \
            "$root/tcp-shift-cubic-single-flow/summary.txt" \
            "$root/linux-cubic/summary.txt" \
            | tee "$root/cubic-single-flow-residual.txt"

      - name: Audit RFC 9438 FlightSize loss reduction
        run: |
          set -o pipefail
          root="$PWD/.build/p6-bbr-first-send-loss"
          python3 scripts/p6-cubic-loss-reduction-audit.py             "$root/tcp-shift-cubic/runtime.stderr"             "$root/linux-cubic/tcp-info-trace.tsv"             | tee "$root/cubic-loss-reduction-audit.txt"

      - name: Compare post-PRR recovery differential
        run: |
          set -o pipefail
          root="$PWD/.build/p6-bbr-first-send-loss"
          python3 scripts/p6-prr-recovery-differential-evaluate.py \
            "$root/tcp-shift-cubic/runtime.stderr" \
            "$root/tcp-shift-cubic/summary.txt" \
            "$root/linux-cubic/tcp-info.tsv" \
            "$root/linux-cubic/summary.txt" \
            | tee "$root/prr-recovery-differential.txt"

      - name: Publish deterministic first-send evidence
        if: always()
        run: |
          root=.build/p6-bbr-first-send-loss
          {
            echo "## Deterministic first-send loss"
            echo
            echo "RTT=260ms rate=10Mbit payload=4MiB markers=28 gap=96 MSS"
            for file in \
              "$root/tcp-shift/summary.txt" \
              "$root/linux-bbr/summary.txt" \
              "$root/comparison.txt" \
              "$root/tcp-shift-cubic/summary.txt" \
              "$root/tcp-shift-cubic-pacing-bypass/summary.txt" \
              "$root/linux-cubic/summary.txt" \
              "$root/controller-matrix.txt" \
              "$root/cubic-pacing-ab.txt" \
              "$root/cubic-fast-convergence-ab.txt" \
              "$root/cubic-loss-timeline.txt" \
              "$root/cubic-preloss-ack.txt" \
              "$root/cubic-postloss-trajectory.txt" \
              "$root/cubic-rfc9438-growth-audit.txt" \
              "$root/cubic-rfc9438-single-flow-growth-audit.txt" \
              "$root/cubic-single-flow-postloss-trajectory.txt" \
              "$root/cubic-single-flow-loss-reduction-audit.txt" \
              "$root/cubic-single-flow-prr-recovery-differential.txt" \
              "$root/cubic-single-flow-residual.txt" \
              "$root/cubic-loss-reduction-audit.txt" \
              "$root/prr-recovery-differential.txt"; do
              if [ -f "$file" ]; then
                echo
                echo '~~~text'
                cat "$file"
                echo '~~~'
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload deterministic first-send diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p6-bbr-first-send-loss
          path: .build/p6-bbr-first-send-loss
          if-no-files-found: warn
          include-hidden-files: true

