  repeated-burst-reference:
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Checkout tcp-shift
        uses: actions/checkout@v4

      - name: Install repeated-burst reference dependencies
        run: |
          sudo apt-get update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            ethtool \
            git \
            iproute2 \
            iptables \
            kmod \
            python3
          sudo modprobe tun || true
          sudo modprobe ifb || true
          sudo modprobe tcp_bbr || true
          test -c /dev/net/tun
          sysctl net.ipv4.tcp_available_congestion_control

      - name: Validate repeated-burst harnesses
        run: |
          sh -n scripts/p6-bbr-long-flow.sh
          sh -n scripts/linux-cubic-pacing-reference.sh
          python3 -m py_compile scripts/p6-bbr-repeated-burst-evaluate.py

      - name: Build internal BBR qualification target
        run: |
          sh scripts/fetch-lwip.sh
          cmake -S . -B .build-p6-bbr-repeated -DCMAKE_BUILD_TYPE=Release -DTCP_SHIFT_EXPERIMENTAL_SACK_EVIDENCE=ON -DTCP_SHIFT_EXPERIMENTAL_RACK_TLP=ON
          cmake --build .build-p6-bbr-repeated --target tcp-shift-p6-bbr --parallel

      - name: Run tcp-shift BBR repeated-burst matrix
        run: |
          for repeats in 2 3 4; do
            out="$PWD/.build/p6-bbr-repeated-burst/tcp-shift/$repeats"
            port=$((18200 + repeats))
            expectation=strict
            sudo env \
              TCP_SHIFT_P6_BBR_LONG_BINARY="$PWD/.build-p6-bbr-repeated/tcp-shift-p6-bbr" \
              TCP_SHIFT_P6_BBR_LONG_OUT="$out" \
              TCP_SHIFT_P6_BBR_LONG_RTT_MS=260 \
              TCP_SHIFT_P6_BBR_LONG_RATE_MBIT=10 \
              TCP_SHIFT_P6_BBR_LONG_PAYLOAD_BYTES=4194304 \
              TCP_SHIFT_P6_BBR_LONG_QUEUE_PKTS=1784 \
              TCP_SHIFT_P6_BBR_LONG_FAULT_MODE=repeated-burst \
              TCP_SHIFT_P6_BBR_LONG_FAULT_BURST_PACKETS=3 \
              TCP_SHIFT_P6_BBR_LONG_FAULT_BURST_REPEATS="$repeats" \
              TCP_SHIFT_P6_BBR_LONG_FAULT_BURST_GAP_PACKETS=700 \
              TCP_SHIFT_P6_BBR_LONG_RECOVERY_EXPECTATION="$expectation" \
              TCP_SHIFT_P6_BBR_LONG_TUN_NAME="tsp6ref$repeats" \
              TCP_SHIFT_P6_BBR_LONG_PUBLIC_PORT="$port" \
              TCP_SHIFT_P6_BBR_LONG_BACKEND_PORT="$((port + 1000))" \
              sh scripts/p6-bbr-long-flow.sh
          done

      - name: Exercise lost RACK retransmission repair
        run: |
          out="$PWD/.build/p6-bbr-repeated-burst/tcp-shift/lost-retransmission"
          sudo env \
            TCP_SHIFT_P6_BBR_LONG_BINARY="$PWD/.build-p6-bbr-repeated/tcp-shift-p6-bbr" \
            TCP_SHIFT_P6_BBR_LONG_OUT="$out" \
            TCP_SHIFT_P6_BBR_LONG_RTT_MS=260 \
            TCP_SHIFT_P6_BBR_LONG_RATE_MBIT=10 \
            TCP_SHIFT_P6_BBR_LONG_PAYLOAD_BYTES=2097152 \
            TCP_SHIFT_P6_BBR_LONG_QUEUE_PKTS=1784 \
            TCP_SHIFT_P6_BBR_LONG_FAULT_MODE=lost-retransmission \
            TCP_SHIFT_P6_BBR_LONG_FAULT_FIRST_PACKET=80 \
            TCP_SHIFT_P6_BBR_LONG_RECOVERY_EXPECTATION=rack \
            TCP_SHIFT_P6_BBR_LONG_TUN_NAME=tsp6rtxloss \
            TCP_SHIFT_P6_BBR_LONG_PUBLIC_PORT=18320 \
            TCP_SHIFT_P6_BBR_LONG_BACKEND_PORT=19320 \
            sh scripts/p6-bbr-long-flow.sh

      - name: Run Linux BBR repeated-burst matrix
        run: |
          for repeats in 2 3 4; do
            out="$PWD/.build/p6-bbr-repeated-burst/linux-bbr/$repeats"
            sudo env \
              TCP_SHIFT_LINUX_PACING_CC=bbr \
              TCP_SHIFT_LINUX_PACING_CASE="repeated-burst-$repeats" \
              TCP_SHIFT_LINUX_PACING_MODE=fq \
              TCP_SHIFT_LINUX_PACING_RTT_MS=260 \
              TCP_SHIFT_LINUX_PACING_RATE_MBIT=10 \
              TCP_SHIFT_LINUX_PACING_PAYLOAD_BYTES=4194304 \
              TCP_SHIFT_LINUX_PACING_QUEUE_PKTS=1784 \
              TCP_SHIFT_LINUX_PACING_FAULT_MODE=repeated-burst \
              TCP_SHIFT_LINUX_PACING_FAULT_BURST_PACKETS=3 \
              TCP_SHIFT_LINUX_PACING_FAULT_BURST_REPEATS="$repeats" \
              TCP_SHIFT_LINUX_PACING_FAULT_BURST_GAP_PACKETS=700 \
              TCP_SHIFT_LINUX_PACING_OUT="$out" \
              sh scripts/linux-cubic-pacing-reference.sh
          done

      - name: Compare repeated-burst recovery
        run: |
          root="$PWD/.build/p6-bbr-repeated-burst"
          sudo chown -R "$USER:$USER" "$root"
          for repeats in 2 3 4; do
            python3 scripts/p6-bbr-repeated-burst-evaluate.py \
              "$repeats" \
              "$root/tcp-shift/$repeats/summary.txt" \
              "$root/linux-bbr/$repeats/summary.txt" \
              | tee "$root/comparison-$repeats.txt"
          done

      - name: Publish repeated-burst evidence
        if: always()
        run: |
          root=.build/p6-bbr-repeated-burst
          {
            echo "## BBR repeated deterministic bursts"
            echo
            echo "RTT=260ms rate=10Mbit payload=4MiB burst=3 packets gap=700 packets"
            for repeats in 2 3 4; do
              echo
              echo "### repeats=$repeats"
              for file in \
                "$root/tcp-shift/$repeats/summary.txt" \
                "$root/linux-bbr/$repeats/summary.txt" \
                "$root/comparison-$repeats.txt"; do
                if [ -f "$file" ]; then
                  echo '~~~text'
                  cat "$file"
                  echo '~~~'
                fi
              done
            done
            if [ -f "$root/tcp-shift/lost-retransmission/summary.txt" ]; then
              echo
              echo "### lost RACK retransmission repair"
              echo '~~~text'
              cat "$root/tcp-shift/lost-retransmission/summary.txt"
              echo '~~~'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload repeated-burst diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p6-bbr-repeated-burst
          path: .build/p6-bbr-repeated-burst
          if-no-files-found: warn
          include-hidden-files: true

